/* ==========================================================================

/* ==========================================================================

   ========================================================================== */

.chip{ display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px; border-radius:var(--r-pill); font:500 var(--t-13)/1 var(--font-ui); color:var(--text-2); background:var(--surface); box-shadow:0 0 0 1px var(--border-strong); transition:color var(--d-micro),background var(--d-micro),box-shadow var(--d-micro),transform var(--d-spring) var(--spring-snap); white-space:nowrap; }

.field{ display:grid; gap:6px; }

/* tooltip */
#tip{ position:fixed; z-index:1000; pointer-events:none; display:flex; align-items:center; gap:8px; padding:5px 6px 5px 9px; border-radius:8px; background:#1B1C20; color:#F1F2F4; font:500 var(--t-12)/1.2 var(--font-ui); box-shadow:0 0 0 1px rgba(255,255,255,.08),0 10px 30px -8px rgba(0,0,0,.5); opacity:0; transform:translateY(3px) scale(.97); transform-origin:var(--tip-origin,50% 100%); transition:opacity 100ms var(--ease-out),transform var(--d-spring) var(--spring); max-width:280px; }

.ring{ position:relative; width:22px; height:22px; display:grid; place-items:center; }

.ring .trk{ stroke:var(--surface-3); }
.ring .val{ stroke:var(--text-3); stroke-linecap:round; transition:stroke-dashoffset var(--d-spring) var(--ease-out),stroke var(--d-fast); }
.ring.warn .val{ stroke:var(--warn); } .ring.over .val{ stroke:var(--error); }
.ring.warn svg,.ring.over svg{ transform:rotate(-90deg) scale(1.3); }
.ring b{ position:relative; font:500 10px/1 var(--font-mono); font-variant-numeric:tabular-nums; opacity:0; transform:scale(.6); transition:opacity var(--d-fast),transform var(--d-spring) var(--spring-snap); }
.ring.warn b,.ring.over b{ opacity:1; transform:none; }
.ring.warn b{ color:var(--warn); } .ring.over b{ color:var(--error); }
.ring.far svg{ opacity:0; transform:rotate(-90deg) scale(.5); }
.ring.pulse{ animation:ringpulse .42s var(--spring-snap); }
@keyframes ringpulse{ 50%{ transform:scale(1.2); } }

.hook{ display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 9px 0 3px; border-radius:99px; background:var(--surface); box-shadow:0 0 0 1px var(--border-strong); font:500 var(--t-12)/1 var(--font-ui); color:var(--text-2); transition:box-shadow var(--d-micro),color var(--d-micro),transform var(--d-spring) var(--spring-snap); }

.hook:active{ transform:scale(.95); }
.hook .sc{ width:20px; height:20px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--accent) calc(var(--v) * 1%),var(--surface-3) 0); position:relative; transition:--v var(--d-slow) var(--ease-out); }
.hook .sc::before{ content:""; position:absolute; inset:2.5px; border-radius:50%; background:var(--surface); }
.hook .sc span{ position:relative; color:var(--text-1); font:600 8.5px/1 var(--font-mono); letter-spacing:-.03em; }
.hook.hi .sc span{ color:var(--accent-text); }
@property --v{ syntax:'<number>'; inherits:true; initial-value:0; }
.hook-reason{ margin-top:10px; padding:14px; border-radius:14px; background:var(--surface); box-shadow:0 0 0 1px var(--border); font-size:var(--t-13); color:var(--text-2); animation:rise var(--d-spring) var(--ease-out) both; }
.force-dark .hook-reason,:root[data-theme="dark"] .hook-reason{ background:var(--surface-2); }

.riffbar{ margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
.riffbar .chip{ height:30px; animation:rise var(--d-spring) var(--ease-out) both; }
.riffbar .chip:nth-child(2){ animation-delay:20ms } .riffbar .chip:nth-child(3){ animation-delay:40ms } .riffbar .chip:nth-child(4){ animation-delay:60ms } .riffbar .chip:nth-child(5){ animation-delay:80ms } .riffbar .chip:nth-child(6){ animation-delay:100ms } .riffbar .chip:nth-child(7){ animation-delay:120ms } .riffbar .chip:nth-child(8){ animation-delay:140ms }
.riffbar .chip .icon{ color:var(--text-3); }
.riffbar .chip:hover .icon{ color:var(--accent-text); }
.diff{ margin-top:10px; border-radius:14px; background:var(--surface); box-shadow:var(--sh-3); overflow:hidden; animation:rise var(--d-snap) var(--ease-out) both; }
.force-dark .diff,:root[data-theme="dark"] .diff{ background:var(--surface-2); }
.diff-h{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; padding:10px 12px 10px 14px; border-bottom:1px solid var(--border); }
.diff-h .grow{ flex:1; }
.diff-b{ padding:14px 16px; font:400 var(--t-17)/1.6 var(--font-ui); white-space:pre-wrap; overflow-wrap:break-word; }
.diff-b .chg{ cursor:pointer; border-radius:4px; transition:background var(--d-micro); }

.diff-b .chg.off del{ text-decoration:none; color:var(--text-1); background:none; border-bottom:1.5px dashed var(--text-3); border-radius:0; }

.diff-b .chg.off .nl-ins,.diff-b .chg:not(.off) .nl-del{ display:none; }
.diff-b.writing::after{ content:""; display:inline-block; width:2px; height:1.1em; vertical-align:-3px; background:var(--accent); margin-left:1px; animation:blink .8s infinite; }
.chg .gap{ display:inline-grid; place-items:center; width:16px; height:16px; margin:0 1px; border-radius:4px; background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--border); font:600 10px/1 var(--font-mono); color:var(--text-3); vertical-align:2px; }
.diff-f{ display:flex; align-items:center; gap:8px; padding:10px 12px 10px 14px; border-top:1px solid var(--border); flex-wrap:wrap; }
.diff-f .grow{ flex:1; }
.delta{ font:500 var(--t-12)/1 var(--font-mono); white-space:nowrap; }
.delta.up{ color:var(--success); } .delta.down{ color:var(--error); }

.add-tw{ display:flex; align-items:center; gap:14px; width:100%; padding:6px 0; color:var(--text-3); font-size:var(--t-14); border-radius:10px; transition:color var(--d-micro); }

.add-tw .kbds{ margin-left:auto; opacity:.8; }
.editor-foot{ margin-top:32px; display:flex; flex-wrap:wrap; gap:8px 16px; color:var(--text-3); font-size:var(--t-12); }
.editor-foot span{ display:inline-flex; align-items:center; gap:6px; }

.preview{ position:sticky; top:0; height:calc(100dvh - 16px); border-left:1px solid var(--border); background:var(--bg-elev); display:flex; flex-direction:column; min-width:0; transition:opacity .45s var(--ease-out); }

.preview-h{ display:flex; align-items:center; justify-content:space-between; gap:8px; height:var(--top-h); padding:0 12px 0 16px; flex:none; border-bottom:1px solid var(--border); }

.pv-close{ display:none; }
.pv{ border-radius:16px; background:var(--surface); box-shadow:0 0 0 1px var(--border),var(--sh-1); overflow:hidden; }

.pv-proj{ margin:0; padding:9px 12px; border-top:1px solid var(--border); font:400 var(--t-12)/1.4 var(--font-ui); color:var(--text-3); }
.pv-tag{ display:flex; align-items:center; justify-content:space-between; padding:9px 12px; border-bottom:1px solid var(--border); font:500 var(--t-12)/1 var(--font-ui); color:var(--text-3); }

/* ==========================================================================
   IDEAS / HOOKS / QUEUE / INSIGHTS / VOICE
   ========================================================================== */
.capture{ position:relative; border-radius:18px; background:var(--surface); box-shadow:0 0 0 1px var(--border-strong),var(--sh-2); padding:4px; transition:box-shadow var(--d-fast); }
.force-dark .capture,:root[data-theme="dark"] .capture{ background:var(--surface-2); }
.capture:focus-within{ box-shadow:0 0 0 1px var(--accent),0 0 0 5px var(--accent-soft),var(--sh-2); }
.capture textarea{ width:100%; min-height:64px; border:0; resize:none; background:transparent; padding:14px 14px 6px; font:400 var(--t-17)/1.5 var(--font-ui); }

.capture-f .grow{ flex:1; }
.drop-hint{ position:absolute; inset:0; border-radius:18px; display:grid; place-items:center; background:color-mix(in srgb,var(--surface) 90%,transparent); box-shadow:inset 0 0 0 2px var(--accent); font-weight:600; color:var(--accent-text); z-index:2; animation:fade var(--d-fast) both; }

.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }

.angles{ display:grid; gap:8px; margin-top:14px; }

.angle .k{ font:600 var(--t-12)/1.2 var(--font-ui); color:var(--text-3); width:86px; }
.starters-t{ font:500 var(--t-13)/1.3 var(--font-ui); color:var(--text-3); }
.angle p{ font-size:var(--t-15); line-height:1.45; }
.inbox{ display:grid; }
.inbox-row{ display:grid; grid-template-columns:32px 1fr auto; gap:12px; align-items:center; padding:11px 10px; border-radius:10px; transition:background var(--d-micro); }

.remix-row{ display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center; padding:16px; }

.grader{ display:grid; grid-template-columns:1fr 280px; padding:0; overflow:hidden; }
.grader textarea{ border:0; background:transparent; resize:none; width:100%; min-height:180px; padding:24px; font:400 var(--t-32)/1.2 var(--font-display); letter-spacing:-.015em; }

.bigscore{ display:flex; align-items:center; gap:14px; }

.bigscore b{ font:400 44px/1 var(--font-display); letter-spacing:-.03em; font-variant-numeric:lining-nums tabular-nums; }
.bars{ display:grid; gap:9px; }

.bar-row .num{ text-align:right; font-size:var(--t-12); color:var(--text-1); }
.hooklib{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
.hk{ padding:16px; display:grid; gap:14px; align-content:space-between; }

.hk .t i{ font-style:italic; color:var(--accent-text); }

.cal-wrap{ display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:18px; align-items:start; }
.cal{ display:grid; grid-template-columns:58px repeat(7,minmax(0,1fr)); border-radius:14px; background:var(--surface); box-shadow:0 0 0 1px var(--border); overflow:hidden; }
.cal .dh{ padding:12px 10px 10px; border-bottom:1px solid var(--border); border-left:1px solid var(--border); display:grid; gap:3px; }
.cal .dh:first-child{ border-left:0; }

.cal .dh .dd{ font:400 var(--t-24)/1 var(--font-display); letter-spacing:-.02em; font-variant-numeric:lining-nums; }
.cal .dh.today .dd,.cal .dh.today .dn{ color:var(--accent-text); }
.cal .tl{ padding:10px 8px; font:500 var(--t-11)/1 var(--font-mono); color:var(--text-3); text-align:right; border-top:1px solid var(--border); }
.slot{ position:relative; min-height:92px; padding:6px; border-top:1px solid var(--border); border-left:1px solid var(--border); transition:background var(--d-micro); }
.slot.past{ background:color-mix(in srgb,var(--surface-2) 55%,transparent); }
.slot.best{ padding-top:16px; }
.slot.best::before{ content:""; position:absolute; top:6px; left:50%; margin-left:-3px; width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft),0 0 10px var(--accent-glow); }
.slot.over{ background:var(--accent-soft); box-shadow:inset 0 0 0 1.5px var(--accent); }
.slot .add{ position:absolute; inset:6px; border-radius:10px; display:grid; place-items:center; color:var(--text-3); opacity:0; transition:opacity var(--d-micro),background var(--d-micro); font-size:var(--t-12); }
.slot:hover .add,.slot .add:focus-visible{ opacity:1; background:var(--surface-2); }
.qcard{ position:relative; z-index:1; display:grid; gap:6px; padding:8px 9px; border-radius:9px; background:var(--bg-elev); box-shadow:0 0 0 1px var(--border-strong); cursor:grab; font-size:var(--t-12); line-height:1.35; text-align:left; width:100%; min-width:0; overflow:hidden; transition:transform var(--d-spring) var(--spring),box-shadow var(--d-fast); }
.force-dark .qcard,:root[data-theme="dark"] .qcard{ background:var(--surface-2); }
.qcard:hover{ box-shadow:0 0 0 1px var(--accent),var(--sh-2); transform:translateY(-1px); }
.qcard.drag{ opacity:.4; }

.qcard .qp{ display:flex; gap:3px; }
.qcard .qp svg{ width:11px; height:11px; }
.qcard.published{ opacity:.6; }
.qcard.published::after{ content:"Sent"; position:absolute; top:6px; right:6px; font:600 9px/1 var(--font-mono); text-transform:uppercase; color:var(--success); }
.side-panel{ display:grid; gap:12px; }
.side-panel .card{ padding:16px; display:grid; gap:12px; }
.setting{ display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center; }
.setting small{ grid-column:1; color:var(--text-3); font-size:var(--t-12); line-height:1.4; }
.upnext{ display:grid; gap:2px; }
.upnext button{ display:grid; grid-template-columns:58px 1fr; gap:10px; padding:8px; border-radius:8px; text-align:left; font-size:var(--t-13); transition:background var(--d-micro); }
.upnext button:hover{ background:var(--surface-2); }
.upnext .when{ font:500 var(--t-11)/1.35 var(--font-mono); color:var(--text-3); white-space:nowrap; }
.upnext p{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.agenda{ display:none; }
.ag-day{ display:grid; gap:8px; padding:14px 0; border-bottom:1px solid var(--border); }

.ag-day h3 span{ font:500 var(--t-11)/1 var(--font-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); }
.ag-day.today h3,.ag-day.today h3 span{ color:var(--accent-text); }
.ag-open{ display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border-radius:12px; box-shadow:inset 0 0 0 1px var(--border); color:var(--text-2); font-size:var(--t-13); text-align:left; background:var(--bg-elev); }
.ag-open .dot{ color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.ag-open b{ margin-left:auto; color:var(--text-1); font-weight:500; display:inline-flex; gap:4px; align-items:center; }

/* ---------------- Threads ---------------- */
.thp{ --t-bg:#FFFFFF; --t-tx:#000000; --t-2:#999999; --t-line:rgba(0,0,0,.15); --t-rail:rgba(0,0,0,.15);
  display:grid; grid-template-columns:48px minmax(0,1fr); gap:0 0; padding:12px 16px 10px; background:var(--t-bg); color:var(--t-tx); font:400 15px/21px var(--pf-sys); border-bottom:1px solid var(--t-line); }
.thp.dark{ --t-bg:#101010; --t-tx:#F3F5F7; --t-2:#777777; --t-line:rgba(243,245,247,.15); --t-rail:rgba(243,245,247,.15); }
.thp .av{ width:36px; height:36px; margin-top:4px; }
.thp .hd{ display:flex; align-items:center; gap:6px; }
.thp .hd .n{ font-weight:600; }
.thp .hd .t{ color:var(--t-2); }
.thp .hd .more{ margin-left:auto; color:var(--t-tx); }
.thp .tx{ margin-top:1px; white-space:pre-wrap; overflow-wrap:anywhere; }
.thp .md{ margin-top:10px; border-radius:8px; overflow:hidden; aspect-ratio:800/474; max-width:340px; border:0.5px solid var(--t-line); }
.thp .md img{ width:100%; height:100%; object-fit:cover; }
.thp .acts{ display:flex; gap:4px; margin:8px 0 0 -8px; color:var(--t-tx); font-size:13px; }
.thp .acts .a{ display:inline-flex; align-items:center; gap:4px; height:36px; padding:0 8px; border-radius:18px; }
.thp .acts .ic{ width:20px; height:20px; stroke-width:1.9; }
.thp .acts .c{ color:var(--t-tx); opacity:.85; font-variant-numeric:tabular-nums; }
.thp.thr{ border-bottom:0; padding-bottom:0; }
.thp .rail{ display:grid; justify-items:center; grid-template-rows:36px 1fr; }
.thp .rail i{ width:2px; margin-top:6px; background:var(--t-rail); border-radius:2px; }

/* ---------------- LinkedIn ---------------- */
.lip{ --l-bg:#FFFFFF; --l-tx:rgba(0,0,0,.9); --l-2:rgba(0,0,0,.6); --l-line:#E8E8E8; --l-blue:#0A66C2; --l-page:#F4F2EE;
  background:var(--l-bg); color:var(--l-tx); font:400 14px/20px var(--pf-sys); border-radius:8px; box-shadow:0 0 0 1px rgba(140,140,140,.2); overflow:hidden; }
.lip.dark{ --l-bg:#1B1F23; --l-tx:rgba(255,255,255,.9); --l-2:rgba(255,255,255,.6); --l-line:#38434F; --l-blue:#71B7FB; box-shadow:0 0 0 1px rgba(255,255,255,.1); }
.lip .hd{ display:grid; grid-template-columns:48px minmax(0,1fr) auto; gap:8px; padding:12px 16px 0; align-items:start; }
.lip .av{ width:48px; height:48px; }
.lip .who{ min-width:0; }
.lip .who b{ display:flex; align-items:center; gap:4px; font-size:14px; line-height:20px; font-weight:600; }
.lip .who b .deg{ font-weight:400; color:var(--l-2); }
.lip .who span{ display:block; font-size:12px; line-height:16px; color:var(--l-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lip .follow{ display:inline-flex; align-items:center; gap:4px; color:var(--l-blue); font-weight:600; font-size:16px; padding:4px 8px; border-radius:4px; }
.lip .tx{ position:relative; padding:8px 16px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
/* clamp by height, not line-clamp: LinkedIn shows no ellipsis of its own, only the …more button */
.lip .tx.clamp{ max-height:calc(8px + 20px * var(--lines,3)); overflow:hidden; }
.lip .seemore{ display:block; text-align:right; padding:0 16px; margin-top:-20px; position:relative; color:var(--l-2); font-size:14px; line-height:20px; }
.lip .seemore span{ background:var(--l-bg); padding-left:6px; box-shadow:-18px 0 12px var(--l-bg); }
.lip .md{ margin-top:8px; aspect-ratio:800/474; background:var(--l-line); }
.lip .md img{ width:100%; height:100%; object-fit:cover; }
.lip .soc{ display:flex; justify-content:space-between; align-items:center; padding:8px 16px; font-size:12px; color:var(--l-2); }
.lip .rx{ display:inline-flex; align-items:center; gap:4px; }
.lip .rx .ico{ display:inline-flex; }
.lip .rx .ico svg{ width:16px; height:16px; margin-right:-3px; border-radius:50%; box-shadow:0 0 0 1.5px var(--l-bg); }
.lip .bar{ display:flex; justify-content:space-around; border-top:1px solid var(--l-line); margin:0 16px; padding:4px 0; }
.lip .bar{ min-height:48px; }
.lip .bar span{ display:inline-flex; align-items:center; gap:6px; padding:12px 8px; font-weight:600; color:var(--l-2); font-size:14px; border-radius:4px; }
.lip .bar .ic{ width:20px; height:20px; }

/* ---------------- Bluesky ---------------- */
.bsp{ --b-bg:#FFFFFF; --b-tx:#000000; --b-2:#405168; --b-ic:#667B99; --b-line:#DCE2EA; --b-blue:#006AFF;
  display:grid; grid-template-columns:42px minmax(0,1fr); gap:0 10px; padding:12px 15px 6px 18px; background:var(--b-bg); color:var(--b-tx); font:400 15px/1.3 Inter,var(--pf-sys); font-variant:no-contextual; border-bottom:1px solid var(--b-line); }
.bsp.dark{ --b-bg:#000000; --b-tx:#FFFFFF; --b-2:#A5B2C5; --b-ic:#667B99; --b-line:#232E3E; }
.bsp .av{ width:42px; height:42px; }
.bsp .hd{ display:flex; align-items:baseline; gap:4px; min-width:0; }
.bsp .hd .n{ font-weight:600; white-space:nowrap; }
.bsp .hd .h, .bsp .hd .t{ color:var(--b-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bsp .hd .n, .bsp .hd .t{ flex:none; } .bsp .hd .h{ min-width:0; }
.bsp .tx{ margin-top:2px; white-space:pre-wrap; overflow-wrap:anywhere; }
.bsp .md{ margin-top:10px; border-radius:8px; overflow:hidden; aspect-ratio:800/474; }
.bsp .md img{ width:100%; height:100%; object-fit:cover; }
.bsp .acts{ display:flex; justify-content:space-between; max-width:340px; margin-top:8px; color:var(--b-ic); font-size:13.1px; }
.bsp .acts .a{ display:inline-flex; align-items:center; gap:4px; height:30px; }
.bsp .acts .ic{ width:18px; height:18px; }

/* ---------------- phone frame + app chrome ---------------- */
.phone{ position:relative; width:var(--pw,320px); aspect-ratio:9/19.3; border-radius:calc(var(--pw,320px) * .16); padding:calc(var(--pw,320px) * .035); background:linear-gradient(145deg,#2A2B2E,#0C0C0D); box-shadow:inset 0 0 0 1.5px #3A3B3F, 0 40px 80px -30px rgba(0,0,0,.55), 0 12px 30px -12px rgba(0,0,0,.35); flex:none; }
.phone .scr{ position:relative; height:100%; border-radius:calc(var(--pw,320px) * .125); overflow:hidden; background:#fff; display:flex; flex-direction:column; container-type:inline-size; }
.phone .scr.dark{ background:#000; }
.phone .island{ position:absolute; top:9px; left:50%; width:30%; height:24px; margin-left:-15%; border-radius:20px; background:#000; z-index:5; }
.phone .sb{ display:flex; justify-content:space-between; align-items:center; height:44px; padding:10px 26px 0 30px; font:600 14px/1 var(--pf-sys); color:#000; flex:none; }
.phone .scr.dark .sb{ color:#fff; }
.phone .sb .ind{ display:flex; gap:5px; align-items:center; }
.phone .sb svg{ height:11px; width:auto; fill:currentColor; }
.phone .apph{ display:grid; grid-template-columns:32px 1fr 32px; align-items:center; height:44px; padding:0 14px; flex:none; }
.phone .apph .av{ width:30px; height:30px; }
.phone .apph .logo{ justify-self:center; width:22px; height:22px; }
.phone .tabs{ display:grid; grid-template-columns:1fr 1fr; height:44px; border-bottom:1px solid #EFF3F4; font:500 14px/1 var(--pf-sys); color:#536471; flex:none; }
.phone .scr.dark .tabs{ border-color:#2F3336; color:#71767B; }
.phone .tabs span{ display:grid; place-items:center; position:relative; }
.phone .tabs span.on{ font-weight:700; color:#0F1419; }
.phone .scr.dark .tabs span.on{ color:#E7E9EA; }
.phone .tabs span.on::after{ content:""; position:absolute; bottom:0; width:56px; height:4px; border-radius:9999px; background:#1D9BF0; }
.phone .feed{ flex:1; overflow:hidden; position:relative; }
.phone .feed .xp .acts{ max-width:none; }
.phone .feed .lip{ border-radius:0; box-shadow:none; border-bottom:6px solid var(--l-page); font-size:13px; line-height:18px; }
.phone .scr.dark .feed .lip{ border-bottom-color:#000; }
.phone .tb{ display:flex; justify-content:space-around; align-items:center; height:52px; border-top:1px solid #EFF3F4; color:#0F1419; flex:none; padding-bottom:10px; }
.phone .scr.dark .tb{ border-color:#2F3336; color:#E7E9EA; }
.phone .ic{ fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
.phone .tb .ic{ width:22px; height:22px; stroke-width:1.9; }
.phone .apph .av{ border-radius:50%; display:grid; place-items:center; color:#fff; font:700 12px/1 -apple-system,BlinkMacSystemFont,sans-serif; background:linear-gradient(135deg,#8B98A5,#536471); }
.phone .fab{ position:absolute; right:14px; bottom:74px; width:52px; height:52px; border-radius:50%; background:#1D9BF0; color:#fff; display:grid; place-items:center; box-shadow:0 6px 16px -4px rgba(0,0,0,.3); }
.phone .fab .ic{ width:22px; height:22px; stroke-width:2.2; }
.phone .home-ind{ position:absolute; bottom:7px; left:50%; width:34%; height:5px; margin-left:-17%; border-radius:5px; background:#000; opacity:.85; }
.phone .scr.dark .home-ind{ background:#fff; }
.phone .me-post{ position:relative; }
.phone .me-post::before{ content:""; position:absolute; inset:0; box-shadow:inset 3px 0 0 #1D9BF0; pointer-events:none; opacity:0; transition:opacity .4s; }
.phone .me-post.hl::before{ opacity:1; }

/* ==========================================================================
   HOMEPAGE: "Keynote for creators"
   Apple's chaptered storytelling, Linear's precision, Arc's warmth.
   Light canvas, one dark keynote chapter, real-looking feeds everywhere.
   The yellow marker is the only brand color: it marks the hook.
   ========================================================================== */
.hw{ --c-bg:#F5F5F3; --c-bg-2:#EDEDEA; --c-ink:#0C0C0E; --c-2:#55565C; --c-3:#8A8B91; --c-line:rgba(12,12,14,.08); --c-card:#FFFFFF; --c-dark:#09090A; --c-dark-2:#141416; --c-mark:#FFE14D;
  --f-disp:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif; --f-hand:'Caveat','Bradley Hand',cursive;
  --ease-o:cubic-bezier(.22,1,.36,1); --ease-io:cubic-bezier(.65,0,.35,1);
  background:var(--c-bg); color:var(--c-ink); font:400 16px/1.55 var(--f-disp); overflow-x:clip; -webkit-font-smoothing:antialiased; }
.hw ::selection{ background:var(--c-mark); color:var(--c-ink); }
.hw .wrap{ max-width:1200px; margin:0 auto; padding-inline:clamp(16px,4vw,40px); }
.hw h1, .hw h2, .hw h3{ margin:0; font-family:var(--f-disp); font-weight:600; letter-spacing:-.045em; text-wrap:balance; }
.hw p{ margin:0; }
.hw .mk{ background:linear-gradient(transparent 58%, var(--c-mark) 58%, var(--c-mark) 92%, transparent 92%) no-repeat 0 0 / var(--mkw,100%) 100%; padding:0 .06em; margin:0 -.06em; border-radius:2px; }
.hw .mk.draw{ --mkw:0%; animation:mkdraw .9s .75s var(--ease-o) forwards; }
@keyframes mkdraw{ to{ --mkw:100%; } }
@property --mkw{ syntax:'<percentage>'; inherits:false; initial-value:100%; }
.hw .hand{ position:absolute; font:500 23px/1.05 var(--f-hand); color:var(--c-2); pointer-events:none; white-space:nowrap; }
.hw .hand svg{ display:block; overflow:visible; }
.hw .hand path{ fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:var(--len,200); stroke-dashoffset:var(--len,200); animation:draw 1s 1.4s var(--ease-o) forwards; }
@keyframes draw{ to{ stroke-dashoffset:0; } }

/* nav */
.hw-nav{ position:sticky; top:0; z-index:60; display:flex; align-items:center; gap:28px; height:60px; padding:0 max(16px,calc((100vw - 1200px)/2 + 40px)); background:color-mix(in srgb,var(--c-bg) 72%,transparent); backdrop-filter:saturate(1.6) blur(16px); -webkit-backdrop-filter:saturate(1.6) blur(16px); border-bottom:1px solid transparent; transition:background .35s,border-color .35s,color .35s; }
.hw-nav.scrolled{ border-bottom-color:var(--c-line); }
.hw-nav.on-dark{ background:color-mix(in srgb,var(--c-dark) 70%,transparent); color:#F5F5F3; border-bottom-color:rgba(255,255,255,.06); }
.hw-nav .logo{ color:inherit; }
.hw-nav .logo .mark .cm{ stroke:currentColor; }
.hw-nav .links{ display:flex; gap:4px; }
.hw-nav .links a{ padding:7px 11px; border-radius:99px; font-size:14px; color:inherit; opacity:.66; transition:opacity .2s,background .2s; }
.hw-nav .links a:hover{ opacity:1; background:rgba(127,127,127,.1); }
.hw-nav .grow{ flex:1; }
.hw-nav .in{ font-size:14px; opacity:.7; padding:7px 10px; }
.hw-nav .in:hover{ opacity:1; }
.hw .hbtn{ display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 18px; border-radius:99px; font:600 15px/1 var(--f-disp); letter-spacing:-.01em; background:var(--c-ink); color:#fff; transition:transform .2s var(--ease-o),box-shadow .2s,background .2s; box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 8px 20px -10px rgba(0,0,0,.6); }
.hw .hbtn:hover{ transform:translateY(-1px); box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 14px 28px -12px rgba(0,0,0,.6); }
.hw .hbtn:active{ transform:scale(.97); }
.hw .hbtn.lg{ height:52px; padding:0 24px; font-size:16.5px; }
.hw .hbtn.light{ background:#F5F5F3; color:var(--c-ink); }
.hw .hbtn .icon{ width:16px; height:16px; }
.hw .ghost{ display:inline-flex; align-items:center; gap:10px; height:52px; padding:0 8px; font:500 16px/1 var(--f-disp); color:var(--c-ink); }
.hw .ghost .play{ display:grid; place-items:center; width:32px; height:32px; border-radius:50%; background:var(--c-card); box-shadow:0 0 0 1px var(--c-line),0 4px 12px -6px rgba(0,0,0,.3); transition:transform .25s var(--ease-o); }
.hw .ghost:hover .play{ transform:scale(1.08); }
.hw-nav.on-dark .hbtn{ background:#F5F5F3; color:var(--c-ink); }
.hw .hbtn:focus-visible, .hw .ghost:focus-visible, .hw-nav a:focus-visible{ outline:2px solid var(--c-ink); outline-offset:3px; }
.hw-nav.on-dark a:focus-visible{ outline-color:#fff; }

/* ---------- hero ---------- */
.hw-hero{ position:relative; padding-top:clamp(40px,7vh,84px); isolation:isolate; }
.hw-hero .top{ position:relative; display:grid; justify-items:center; text-align:center; gap:22px; }
.hw-hero h1{ font-size:clamp(52px,8.2vw,124px); line-height:.94; letter-spacing:-.058em; max-width:12ch; }
.hw-hero h1 .w{ display:inline-block; white-space:pre; animation:wordin .9s var(--ease-o) both; animation-delay:calc(.05s + var(--i) * .06s); }
@keyframes wordin{ from{ opacity:0; transform:translateY(.28em); filter:blur(12px); } }
.hw-hero .sub{ max-width:38rem; font-size:clamp(17px,1.45vw,20px); line-height:1.5; color:var(--c-2); letter-spacing:-.01em; animation:wordin 1s .35s var(--ease-o) both; }
.hw-hero .cta{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; justify-content:center; animation:wordin 1s .45s var(--ease-o) both; }
.hw-hero .n1{ left:calc(50% - 350px); top:calc(100% - 64px); transform:rotate(-6deg); }
.hw-hero .n2{ left:calc(50% + 300px); top:calc(100% - 118px); transform:rotate(5deg); }

/* the ring: posts on the inside of a cylinder, like a feed seen from within */
.c3d{ position:relative; height:clamp(420px,52vh,540px); margin-top:clamp(28px,5vh,56px); perspective:1100px; perspective-origin:50% 42%; cursor:grab; touch-action:pan-y; user-select:none; -webkit-user-select:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent); mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent); }
.c3d.drag{ cursor:grabbing; }
.c3d .stage{ position:absolute; left:50%; top:0; width:0; height:100%; transform-style:preserve-3d; }
.c3d .cc{ position:absolute; left:-160px; top:40px; width:320px; transform-style:preserve-3d; will-change:transform; backface-visibility:hidden; border-radius:18px; }
.c3d .cc .xp{ width:400px; zoom:.8; border-radius:22px; border:0; box-shadow:0 0 0 1px rgba(12,12,14,.06),0 30px 50px -30px rgba(12,12,14,.35),0 6px 14px -8px rgba(12,12,14,.12); padding:14px 16px 6px; }
.c3d .cc .xp .md{ aspect-ratio:800/474; }
.c3d .cc .xp .acts{ max-width:none; }
.c3d .cc .hchip{ position:absolute; left:50%; top:-42px; transform:translate(-50%,6px) scale(.9); opacity:0; display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 12px 0 6px; border-radius:99px; background:var(--c-ink); color:#fff; font:600 13px/1 var(--f-disp); white-space:nowrap; box-shadow:0 10px 24px -10px rgba(0,0,0,.6); transition:opacity .35s,transform .45s var(--ease-o); z-index:2; }
.c3d .cc .hchip b{ display:grid; place-items:center; min-width:22px; height:22px; padding:0 5px; border-radius:99px; background:var(--c-mark); color:var(--c-ink); font:600 12px/1 var(--font-mono); }
.c3d .cc.stop .hchip{ opacity:1; transform:translate(-50%,0) scale(1); }
.c3d .cc .xp .tx .first{ background:linear-gradient(transparent 60%, rgba(255,225,77,.85) 60%, rgba(255,225,77,.85) 94%, transparent 94%) no-repeat 0 0 / 0% 100%; transition:background-size .7s .15s var(--ease-o); }
.c3d .cc.stop .xp .tx .first{ background-size:100% 100%; }
.ring-cap{ text-align:center; font-size:12.5px; color:var(--c-3); margin-top:6px; }

/* ---------- chapters ---------- */
.hw-sec{ padding-top:clamp(110px,14vw,190px); }
.hw .hw-h{ display:grid; gap:18px; max-width:52rem; margin-bottom:clamp(40px,5vw,64px); }
.hw .hw-h.c{ margin-inline:auto; text-align:center; justify-items:center; }
.hw-h h2{ font-size:clamp(42px,5.6vw,80px); line-height:.98; }
.hw-h p{ font-size:clamp(17px,1.4vw,20px); color:var(--c-2); max-width:36rem; letter-spacing:-.01em; }
.rv{ transition:opacity .9s var(--ease-o),transform .9s var(--ease-o),filter .9s var(--ease-o); transition-delay:var(--d,0s); }
.rv.armed{ opacity:0; transform:translateY(28px); filter:blur(10px); }

/* ---------- the keynote: a draft becomes a hook (pinned, scroll-scrubbed) ---------- */
.story{ position:relative; height:520vh; background:var(--c-dark); color:#F5F5F3; margin-top:clamp(90px,11vw,150px); }
.story .pin{ position:sticky; top:0; height:100vh; height:100dvh; overflow:hidden; display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr); align-items:center; gap:clamp(24px,4vw,64px); padding-inline:max(16px,calc((100vw - 1200px)/2 + 40px)); }
.story .pin::before{ content:""; position:absolute; inset:0; background:radial-gradient(60% 50% at 70% 50%,rgba(255,255,255,.06),transparent 70%); pointer-events:none; }
.story .caps{ position:relative; height:260px; }
.story .cap{ position:absolute; inset:0; display:grid; align-content:center; gap:16px; opacity:0; transform:translateY(24px); filter:blur(8px); transition:opacity .5s var(--ease-o),transform .6s var(--ease-o),filter .5s var(--ease-o); }
.story .cap.on{ opacity:1; transform:none; filter:none; }
.story .cap h3{ font-size:clamp(34px,3.6vw,56px); line-height:1; letter-spacing:-.045em; }
.story .cap p{ font-size:18px; color:#A2A3A9; max-width:26rem; }
.story .prog{ position:absolute; left:0; bottom:-40px; display:flex; gap:6px; }
.story .prog i{ width:28px; height:3px; border-radius:3px; background:rgba(255,255,255,.14); overflow:hidden; position:relative; }
.story .prog i b{ position:absolute; inset:0; background:#F5F5F3; transform-origin:left; transform:scaleX(var(--p,0)); }
.story .stage{ position:relative; height:min(640px,82vh); }
.win{ position:absolute; left:0; top:50%; width:min(620px,100%); transform:translateY(-50%); border-radius:18px; background:#141416; box-shadow:0 0 0 1px rgba(255,255,255,.08),0 60px 120px -40px rgba(0,0,0,.9); overflow:hidden; transition:transform .7s var(--ease-o),opacity .5s; }
.win .bar{ display:flex; align-items:center; gap:7px; height:40px; padding:0 14px; border-bottom:1px solid rgba(255,255,255,.06); }
.win .bar i{ width:11px; height:11px; border-radius:50%; background:#2B2C30; }
.win .bar span{ margin-left:auto; margin-right:auto; font:500 12px/1 var(--font-mono); color:#6E6F75; }
.win .body{ display:grid; grid-template-columns:40px minmax(0,1fr); gap:0 12px; padding:22px 22px 18px; }
.win .avatar{ width:40px; height:40px; }
.win .who{ font:600 15px/20px var(--f-disp); }
.win .who span{ color:#6E6F75; font-weight:400; }
.win .draft{ grid-column:2; min-height:120px; margin-top:6px; font:400 clamp(18px,1.6vw,21px)/1.5 var(--f-disp); letter-spacing:-.01em; color:#F5F5F3; white-space:pre-wrap; }
.win .draft .stcaret{ display:inline-block; width:2px; height:1.15em; margin-left:1px; vertical-align:-3px; background:#F5F5F3; animation:blinkc 1s steps(1) infinite; }
@keyframes blinkc{ 50%{ opacity:0; } }
.win .draft .hedge{ text-decoration:underline wavy #F26D6D 1.5px; text-underline-offset:5px; }
.win .draft del{ color:#F29C9C; background:rgba(242,109,109,.14); text-decoration-color:rgba(242,109,109,.8); border-radius:4px; }

/* ---------- creators ---------- */
.cr{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }

'use strict';
/* ==========================================================================
   MURMUR · app script
   Sections: core · springs · state · intelligence (hooks, riffs, diff, ghost)
   · ideas · ui kit · router · views · boot
   Everything runs locally with mock data. The AI layer is deterministic and
   lives in `AI` so a real model endpoint can replace it one function at a time.
   ========================================================================== */

/* ---------- core ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (id, cls = '') => `<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const pic = (id, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><use href="#p-${id}"/></svg>`;
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const lcFirst = s => s && !/^[A-Z]{2}|^I\b/.test(s) ? s[0].toLowerCase() + s.slice(1) : s;
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const MOD = IS_MAC ? '⌘' : 'Ctrl';
const ALT = IS_MAC ? '⌥' : 'Alt';
const SHIFT = IS_MAC ? '⇧' : 'Shift';
const kbd = (...keys) => `<span class="kbds">${keys.map(k => `<kbd>${esc(k)}</kbd>`).join('')}</span>`;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FINE = matchMedia('(pointer: fine)').matches;
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const fmtK = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'k' : String(Math.round(n));
const DAY = 864e5;
const dayKey = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const startOfWeek = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); const k = (x.getDay() + 6) % 7; x.setDate(x.getDate() - k); return x; };
const fmtTime = t => { const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')}${h < 12 ? 'am' : 'pm'}`; };
const ago = ts => { const s = (Date.now() - ts) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; return Math.floor(s / 86400) + 'd ago'; };

const store = {
  get(k, d) { try { const v = localStorage.getItem('hookworthy:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('hookworthy:' + k, JSON.stringify(v)); } catch (e) { /* storage blocked: app keeps working in memory */ } }
};

/* ---------- springs: real physics baked into CSS linear() ---------- */
function springEase(stiffness, damping, mass = 1) {
  const w0 = Math.sqrt(stiffness / mass), z = damping / (2 * Math.sqrt(stiffness * mass));
  const wd = w0 * Math.sqrt(Math.max(1e-6, 1 - z * z));
  const x = t => z < 1 ? 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)) : 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  let T = 0.1; for (let t = 0; t < 3; t += 1 / 240) if (Math.abs(1 - x(t)) > 0.006) T = t;
  const n = 36, pts = [];
  for (let i = 0; i <= n; i++) pts.push(+x(T * i / n).toFixed(4));
  pts[n] = 1;
  return { ease: `linear(${pts.join(', ')})`, ms: Math.round(T * 1000) };
}
(function installSprings() {
  if (REDUCED || !CSS.supports('transition-timing-function', 'linear(0, 1)')) return;
  const r = document.documentElement.style;
  const a = springEase(380, 30), b = springEase(600, 26);
  r.setProperty('--spring', a.ease); r.setProperty('--d-spring', a.ms + 'ms');
  r.setProperty('--spring-snap', b.ease); r.setProperty('--d-snap', b.ms + 'ms');
})();

function series(days) {

    const trend = 9000 + (i / days) * 4200; const spike = dow === 2 ? 1.42 : dow === 4 ? 1.18 : dow === 0 || dow === 6 ? .8 : 1;
    return Math.round(trend * spike * (.9 + r() * .2));

}
function niceTicks(max, n = 4) { const raw = max / n; const mag = Math.pow(10, Math.floor(Math.log10(raw))); const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw); return Array.from({ length: Math.ceil(max / step) + 1 }, (_, i) => i * step); }

function heatmap() {

function lineChart(host, data) {

  <section class="sec"><div class="sec-h"><h2 class="h2">Components, every state</h2></div><div class="card pad" style="display:grid;gap:28px">
    <div class="state-grid">${['Default', 'Hover', 'Focus', 'Active', 'Disabled', 'Loading'].map((s, i) => `<div><span class="label">${s}</span><button class="btn primary ${['', 'force-hover', 'force-focus', 'force-active', '', 'is-loading'][i]}" ${i === 4 ? 'disabled' : ''} tabindex="-1">Schedule</button><button class="btn ${['', 'force-hover', 'force-focus', 'force-active', '', 'is-loading'][i]}" ${i === 4 ? 'disabled' : ''} tabindex="-1">Save idea</button></div>`).join('')}</div>
    <div class="state-grid">${[['Default', ''], ['Focus', 'box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--accent-soft)'], ['Error', ''], ['Disabled', '']].map(([s, st], i) => `<div><span class="label">${s}</span><input class="input" tabindex="-1" value="${i ? '@samwrites' : ''}" placeholder="yourhandle" style="${st}" ${i === 2 ? 'aria-invalid="true"' : ''} ${i === 3 ? 'disabled' : ''} aria-label="Example input ${s}">${i === 2 ? '<span class="field-err">Handles use letters, numbers, dots and underscores.</span>' : ''}</div>`).join('')}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="chip" aria-pressed="false" tabindex="-1">Chip</button><button class="chip" aria-pressed="true" tabindex="-1">Selected</button><span class="pill">Pill</span><span class="pill accent">Accent</span><span class="pill success">Published</span><span class="pill error">Over limit</span><button class="switch" role="switch" aria-checked="true" id="demo-sw" aria-label="Example switch"></button><span class="hook hi"><span class="sc" style="--v:88"><span>88</span></span><span>Hook</span></span><button class="btn primary sm is-loading" tabindex="-1">Loading</button></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-bact="toast">Show a toast</button><button class="btn" data-bact="modal">Open a modal</button><button class="btn" data-bact="menu" aria-haspopup="menu">Open a menu${ic('down', 'sm')}</button><button class="btn" data-tip="Tooltips show shortcuts too" data-kbd="${MOD} K">Hover for a tooltip</button><button class="btn" data-act="palette">${kbd(MOD, 'K')} Palette</button></div></div></section>
  <section class="sec"><div class="sec-h"><h2 class="h2">Voice rules</h2></div><div class="grid-3">${[['Short sentences.', 'One idea each. If it needs a comma splice, it needs two sentences.'], ['Specific beats clever.', 'Numbers over adjectives. “Trials up 22%” beats “amazing growth”.'], ['Friend who edits.', 'Direct, a little dry, always on your side.'], ['Celebrate quietly.', 'One exclamation mark per screen, max. Usually zero.'], ['Errors help.', 'Say what happened and what to do. No “Oops”.'], ['Banned words.', 'Unlock, supercharge, leverage, elevate, seamless, game-changer, delve.']].map(([a, b]) => `<div class="card pad" style="display:grid;gap:6px"><b>${a}</b><p class="muted" style="font-size:14px">${b}</p></div>`).join('')}</div></section>
  </div>`);
  $('#play-reward').onclick = e => burstFrom(e.currentTarget);
  $('#demo-sw').onclick = e => e.currentTarget.setAttribute('aria-checked', e.currentTarget.getAttribute('aria-checked') !== 'true');
  $('#view').addEventListener('click', e => {
    const b = e.target.closest('[data-bact]'); if (!b) return;
    if (b.dataset.bact === 'toast') toast('Scheduled for Tue 8:40am. Go touch grass.', { icon: 'clock', tone: 'accent', action: 'Undo', onAction: () => toast('Undone.', { icon: 'undo' }) });
    if (b.dataset.bact === 'modal') modal(`${modalHead('A modal', 'Springs in, fades out, traps focus, closes on Esc.')}<div class="modal-b"><p class="muted">Every overlay in Hookworthy uses this one. Try Tab, then Esc.</p></div><div class="modal-f"><button class="btn" data-close>Cancel</button><button class="btn primary" data-close>Got it</button></div>`, { label: 'Example modal' });
    if (b.dataset.bact === 'menu') openMenu(b, [{ label: 'Publish now', icon: 'send', kbd: [MOD, SHIFT, '↵'], run: () => toast('Menus run real actions.', { icon: 'check' }) }, { label: 'Schedule…', icon: 'clock', kbd: [MOD, '↵'], run: () => toast('Arrow keys work too.', { icon: 'check' }) }, '-', { label: 'Delete', icon: 'trash', run: () => toast('Nothing was deleted. It’s a demo.', { icon: 'trash' }) }]);
  });
};

/* ==========================================================================
   BOOT
   ========================================================================== */
applyTheme();
route();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/claude|anthropic/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
</body>
</html>
