/* ==========================================================================
   BASE
   ========================================================================== */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg); color:var(--text-1);
  font:400 var(--t-14)/1.5 var(--font-ui); letter-spacing:0;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility;

img{ max-width:100%; display:block; }
button,input,textarea,select{ font:inherit; color:inherit; letter-spacing:inherit; }
button{ cursor:pointer; background:none; border:0; padding:0; }
a{ color:inherit; text-decoration:none; }
:focus{ outline:none; }
:focus-visible{ box-shadow:var(--focus); border-radius:var(--r-sm); }
:is(.tw-input,.handle-in input,.hero-handle input,.capture textarea,#grader-t,.cmdk-in input):focus-visible{ box-shadow:none; }

.icon.sm{ width:16px; height:16px; } .icon.xs{ width:14px; height:14px; } .icon.lg{ width:24px; height:24px; }
.display{ margin:0; font-family:var(--font-display); font-weight:400; letter-spacing:-.012em; line-height:1.02; text-wrap:balance; hanging-punctuation:first last; font-feature-settings:"liga","dlig","onum"; }
.display em, .display .mk{ font-style:italic; background:var(--psq) no-repeat 0 100% / 100% .24em; padding:0 .02em .08em; margin:0; -webkit-box-decoration-break:clone; box-decoration-break:clone; animation:mkin .8s .25s var(--ease-out) both; }
@keyframes mkin{ from{ background-size:0% .24em; } }
.h1{ font:400 40px/1.05 var(--font-display); letter-spacing:-.01em; text-wrap:balance; margin:0; }
.h2{ font:600 19px/1.25 var(--font-ui); letter-spacing:0; text-wrap:balance; margin:0; }
.h3{ font:600 var(--t-15)/1.35 var(--font-ui); letter-spacing:0; margin:0; }
.label{ font:500 var(--t-12)/1.2 var(--font-ui); letter-spacing:0; color:var(--text-3); }
.muted{ color:var(--text-2); } .faint{ color:var(--text-3); } .accent{ color:var(--accent-text); }
p{ margin:0; }

.kbds{ display:inline-flex; gap:3px; }

.btn{

  height:var(--bh); padding:0 14px; border-radius:10px;
  font:500 var(--t-14)/1 var(--font-ui); letter-spacing:0; white-space:nowrap;
  color:var(--text-1); background:var(--surface); box-shadow:0 0 0 1px var(--border-strong),var(--sh-1);
  transition:background var(--d-micro) var(--ease-out),box-shadow var(--d-micro) var(--ease-out),transform var(--d-spring) var(--spring-snap),color var(--d-micro),opacity var(--d-micro);

.btn.sm{ --bh:28px; padding:0 11px; font-size:var(--t-13); gap:6px; }

.btn.ghost:hover{ background:var(--surface-2); color:var(--text-1); }

#root{ min-height:100%; }

/* view transitions between routes */

.checks-pill{ height:24px; padding:0 10px; border-radius:99px; font-size:var(--t-12); font-weight:500; color:var(--warn); background:var(--warn-soft); margin-left:8px; white-space:nowrap; transition:filter var(--d-micro); }

.upsell{ position:fixed; z-index:880; right:20px; bottom:20px; width:min(380px,calc(100vw - 32px)); padding:20px; border-radius:18px; background:var(--surface); box-shadow:var(--sh-4); animation:sheetin var(--d-snap) var(--spring) both; overflow:hidden; }

.cmdk-f span{ display:inline-flex; gap:6px; align-items:center; }
.cmdk-empty{ padding:28px; text-align:center; color:var(--text-2); }

.shortcuts{ display:grid; grid-template-columns:1fr 1fr; gap:4px 28px; }
.shortcuts .sc-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid var(--border); font-size:var(--t-13); }

.gifs{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }

.sched-times{ display:grid; gap:8px; }
.stime{ display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:12px 14px; border-radius:12px; text-align:left; box-shadow:0 0 0 1px var(--border-strong); transition:box-shadow var(--d-fast),background var(--d-fast),transform var(--d-spring) var(--spring-snap); }

.stime .radio{ width:16px; height:16px; border-radius:50%; box-shadow:inset 0 0 0 1.5px var(--border-strong); transition:box-shadow var(--d-spring) var(--spring-snap); }

/* ==========================================================================

   ========================================================================== */
.onb{ min-height:100vh; min-height:100dvh; display:grid; grid-template-rows:auto 1fr; background:var(--bg); color:var(--text-1); position:relative; overflow:hidden; }

.handle-in{ display:flex; align-items:center; gap:6px; width:min(460px,100%); height:58px; padding:6px 6px 6px 18px; border-radius:16px; background:var(--surface); box-shadow:0 0 0 1px var(--border-strong),var(--sh-3); transition:box-shadow var(--d-fast); }

.reading{ display:grid; gap:12px; width:min(420px,100%); text-align:left; }

.reading .st .ck{ width:20px; height:20px; border-radius:50%; display:grid; place-items:center; box-shadow:inset 0 0 0 1.5px var(--border-strong); flex:none; transition:all var(--d-spring) var(--spring-snap); }
.reading .st.on{ color:var(--text-1); }

.onb-result{ width:min(1000px,100%); display:grid; gap:28px; position:relative; z-index:1; }

.onb-result .grid{ display:grid; grid-template-columns:320px 1fr; gap:14px; align-items:start; }

/* ==========================================================================
   PLATFORM POSTS: renders that match each app's real feed UI.
   X, Threads, LinkedIn and Bluesky, light and dark. Used by the homepage and
   by the composer's "In the feed" preview, so what you see is what ships.
   ========================================================================== */
.pf{ --pf-sys:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; text-align:left; -webkit-font-smoothing:antialiased; }

.av.ini{ position:relative; overflow:hidden; }
.av .avp{ position:absolute; inset:0; border-radius:inherit; background:var(--spr-av) no-repeat 0 0 / 100% 1800%; }
.no-spr .pf .md, .no-spr .avp:not(.avp2), .no-spr2 .avp2{ display:none; }
.av .avp2{ background:var(--spr-av2) no-repeat 0 0 / 100% 600%; }
.pf .md .mdp{ display:block; width:100%; height:100%; background:var(--spr-ph) no-repeat 0 0 / 100% 600%; }
.pf .ic{ width:18.75px; height:18.75px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; flex:none; }

/* ---------------- X ---------------- */
.xp{ --x-bg:#FFFFFF; --x-tx:#0F1419; --x-2:#536471; --x-line:#EFF3F4; --x-media:#CFD9DE; --x-blue:#1D9BF0; --x-hover:rgba(15,20,25,.03);
  display:grid; grid-template-columns:40px minmax(0,1fr); gap:0 8px; padding:12px 16px 4px; background:var(--x-bg); color:var(--x-tx); font:400 15px/20px var(--pf-sys); border-bottom:1px solid var(--x-line); }
.xp.dark{ --x-bg:#000000; --x-tx:#E7E9EA; --x-2:#71767B; --x-line:#2F3336; --x-media:#2F3336; --x-hover:rgba(231,233,234,.03); }

.xp .acts .a{ display:inline-flex; align-items:center; gap:2px; min-width:0; }

.xp .acts .a.rp:hover{ color:#1D9BF0; } .xp .acts .a.rp:hover .b{ background:rgba(29,155,240,.1); }

/* ---------------- Threads ---------------- */
.thp{ --t-bg:#FFFFFF; --t-tx:#000000; --t-2:#999999; --t-line:rgba(0,0,0,.15); --t-rail:rgba(0,0,0,.15);
  display:grid; grid-template-columns:48px minmax(0,1fr); gap:0 0; padding:12px 16px 10px; background:var(--t-bg); color:var(--t-tx); font:400 15px/21px var(--pf-sys); border-bottom:1px solid var(--t-line); }

.thp .rail i{ width:2px; margin-top:6px; background:var(--t-rail); border-radius:2px; }

/* ---------------- LinkedIn ---------------- */
.lip{ --l-bg:#FFFFFF; --l-tx:rgba(0,0,0,.9); --l-2:rgba(0,0,0,.6); --l-line:#E8E8E8; --l-blue:#0A66C2; --l-page:#F4F2EE;
  background:var(--l-bg); color:var(--l-tx); font:400 14px/20px var(--pf-sys); border-radius:8px; box-shadow:0 0 0 1px rgba(140,140,140,.2); overflow:hidden; }

.lip .hd{ display:grid; grid-template-columns:48px minmax(0,1fr) auto; gap:8px; padding:12px 16px 0; align-items:start; }

.lip .who span{ display:block; font-size:12px; line-height:16px; color:var(--l-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.lip .tx{ position:relative; padding:8px 16px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
/* clamp by height, not line-clamp: LinkedIn shows no ellipsis of its own, only the …more button */
.lip .tx.clamp{ max-height:calc(8px + var(--lh,20px) * var(--lines,3)); overflow:hidden; }
.lip .seemore{ display:block; text-align:right; padding:0 16px; margin-top:calc(-1 * var(--lh,20px)); position:relative; color:var(--l-2); font-size:inherit; line-height:var(--lh,20px); }
.lip .seemore span{ display:inline-block; background:linear-gradient(90deg,transparent,var(--l-bg) 22px); padding-left:26px; }
.lip .tx.clamp + .seemore{ top:-1px; }
.lip .md{ margin-top:8px; aspect-ratio:800/474; background:var(--l-line); }
.lip .md img{ width:100%; height:100%; object-fit:cover; }
.lip .soc{ display:flex; justify-content:space-between; align-items:center; padding:8px 16px; font-size:12px; color:var(--l-2); }
.lip .rx{ display:inline-flex; align-items:center; gap:4px; }

.lip .rx .ico svg{ width:16px; height:16px; margin-right:-3px; border-radius:50%; box-shadow:0 0 0 1.5px var(--l-bg); }
.lip .bar{ display:flex; justify-content:space-around; border-top:1px solid var(--l-line); margin:0 16px; padding:4px 0; }
.lip .bar{ min-height:48px; }
.lip .bar span{ display:inline-flex; align-items:center; gap:6px; padding:12px 8px; font-weight:600; color:var(--l-2); font-size:14px; border-radius:4px; }
.lip .bar .ic{ width:20px; height:20px; }
/* narrow cards: LinkedIn's own mobile action bar (icon over label), so nothing forces the card wider than its column */
.lip{ container-type:inline-size; }
.lip .bar span{ min-width:0; }
@container (max-width:420px){ .lip .bar{ margin:0 8px; } .lip .bar span{ flex-direction:column; gap:2px; padding:8px 2px 6px; font-size:11.5px; font-weight:600; } .lip .bar .ic{ width:18px; height:18px; } .lip .follow{ font-size:14px; padding:4px 2px; } }

/* ---------------- Bluesky ---------------- */
.bsp{ --b-bg:#FFFFFF; --b-tx:#000000; --b-2:#405168; --b-ic:#667B99; --b-line:#DCE2EA; --b-blue:#006AFF;
  display:grid; grid-template-columns:42px minmax(0,1fr); gap:0 10px; padding:12px 15px 6px 18px; background:var(--b-bg); color:var(--b-tx); font:400 15px/1.3 Inter,var(--pf-sys); font-variant:no-contextual; border-bottom:1px solid var(--b-line); }

.bsp .tx{ margin-top:2px; white-space:pre-wrap; overflow-wrap:anywhere; }

/* ---------------- phone frame + app chrome ---------------- */

/* ==========================================================================
   HOMEPAGE: "Keynote for creators"
   Apple's chaptered storytelling, Linear's precision, Arc's warmth.
   Light canvas, one dark keynote chapter, real-looking feeds everywhere.
   The accent (Flow blue by default) is the only brand color: a soft tint of it marks the hook.
   ========================================================================== */
.hw{ --c-bg:#FEFDF1; --c-bg-2:#F2F0E3; --c-ink:#1A1A1A; --c-2:#4D4C46; --c-3:#65645C; --c-line:rgba(26,26,26,.08); --c-card:#FFFFF8; --c-dark:var(--pb1); --c-dark-2:color-mix(in srgb,var(--pb1),#fff 9%); --c-black:var(--pb2); --c-peri:var(--pa); --c-ember:var(--psp); --c-mark:var(--pa); --c-acc:var(--acc-l); --c-acc-ink:var(--acc-l-ink); --c-lt:#F6F4E6;
  --f-disp:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif; --f-serif:'EB Garamond','Iowan Old Style','Palatino Linotype',Georgia,serif; --f-hand:'Caveat','Bradley Hand',cursive;
  --ease-o:cubic-bezier(.22,1,.36,1); --ease-io:cubic-bezier(.65,0,.35,1);
  background:var(--c-bg); color:var(--c-ink); font:400 16px/1.55 var(--f-disp); overflow-x:clip; -webkit-font-smoothing:antialiased; }
.hw p, .hw h2, .hw h3{ text-wrap:pretty; }
.hw ::selection{ background:var(--c-mark); color:var(--c-ink); }
.hw .wrap{ max-width:1200px; margin:0 auto; padding-inline:clamp(16px,4vw,40px); }
.hw h1, .hw h2, .hw h3{ margin:0; text-wrap:balance; }
.hw h1, .hw h2{ font-family:var(--f-serif); font-weight:400; letter-spacing:-.018em; line-height:1; }
.hw h3{ font-family:var(--f-disp); font-weight:600; letter-spacing:0; }
.hw h1 .mk, .hw h2 .mk, .hw h1 em, .hw h2 em{ font-style:italic; }
.hw p{ margin:0; }
.hw .mk{ background:var(--psq) no-repeat 0 100% / var(--mkw,100%) .26em; padding:0 .02em .1em; }
.hw .story, .hw .voice2, .hw .on-dark{ --c-mark:color-mix(in srgb,var(--pa) 40%,transparent); }
.hw .mk.draw{ --mkw:0%; animation:mkdraw .9s .75s var(--ease-o) forwards; }
@keyframes mkdraw{ to{ --mkw:100%; } }
@property --mkw{ syntax:'<percentage>'; inherits:false; initial-value:100%; }
.hw .hand{ position:absolute; font:500 23px/1.05 var(--f-hand); color:var(--c-2); pointer-events:none; white-space:nowrap; }
.hw .hand svg{ display:block; overflow:visible; }
.hw .hand path{ fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:var(--len,200); stroke-dashoffset:var(--len,200); animation:draw 1s 1.4s var(--ease-o) forwards; }
@keyframes draw{ to{ stroke-dashoffset:0; } }

/* nav */

/* Wispr grammar, in blue: announcement bar, floating bordered nav, eyebrows, roman + italic headlines, bordered periwinkle buttons, color blocks */
.hw-ann{ display:flex; justify-content:center; align-items:center; gap:14px; flex-wrap:wrap; min-height:44px; padding:10px 16px; background:var(--c-dark); color:#FEFDF1; font:500 14px/1.3 var(--f-disp); text-align:center; }
.hw-ann b{ font-weight:700; } .hw-ann .go{ font-weight:700; white-space:nowrap; } .hw-ann:hover .go{ text-decoration:underline; text-underline-offset:3px; }
.hw .eyebrow{ display:block; margin-bottom:20px; font:500 12.5px/1 var(--f-disp); letter-spacing:.14em; text-transform:uppercase; color:var(--c-2); }
.hw h1 em, .hw h2 em, .hw h3 em{ font-style:italic; }
.hw h1, .hw h2{ font-family:var(--f-serif); font-weight:400; letter-spacing:-.012em; line-height:1.04; }
.hw-hero h1{ font-size:clamp(56px,8.4vw,128px) !important; letter-spacing:-.018em !important; line-height:1.02 !important; }
.story .eyebrow, .voice2 .eyebrow, .fin .eyebrow{ color:rgba(254,253,241,.94); }
.fin{ background:var(--pb3); color:#FEFDF1; border-radius:clamp(28px,4vw,56px); margin:clamp(90px,10vw,140px) clamp(8px,1vw,14px) 14px; }
.fin p{ color:rgba(254,253,241,.9) !important; } .hw .fin .ghost{ color:#FEFDF1; } .hw .fin .ghost .play{ color:#1A1A1A; }
.hw-hero h1{ margin-bottom:22px; }
.story{ border-radius:clamp(28px,4vw,56px) clamp(28px,4vw,56px) 0 0; margin-inline:clamp(8px,1vw,14px); }
.hw-nav{ position:sticky; top:12px; z-index:60; display:flex; align-items:center; gap:22px; height:58px; width:min(920px,calc(100% - 24px)); margin:14px auto 0; padding:0 8px 0 18px; background:#FFFFF8; border:1px solid var(--c-line); border-radius:14px; box-shadow:0 1px 0 rgba(26,26,26,.03); -webkit-backdrop-filter:saturate(1.6) blur(16px); border-bottom:1px solid transparent; transition:background .35s,border-color .35s,color .35s; }
.hw-nav.scrolled{ box-shadow:0 10px 30px -18px rgba(26,26,26,.35); }
.hw-nav.on-dark{ background:#FFFFF8; color:var(--c-ink); }
.hw-nav .logo{ color:inherit; }

.hw-nav .links{ display:flex; gap:4px; }
.hw-nav .links a{ padding:7px 11px; border-radius:99px; font-size:14px; color:inherit; opacity:.66; transition:opacity .2s,background .2s; }
.hw-nav .links a:hover{ opacity:1; background:rgba(127,127,127,.1); }
.hw-nav .grow{ flex:1; }
.hw-nav .in{ font-size:14px; opacity:.7; padding:7px 10px; }
.hw-nav .in:hover{ opacity:1; }
.hw .hbtn{ display:inline-flex; align-items:center; gap:8px; height:42px; padding:0 18px; border-radius:10px; font:600 15px/1 var(--f-disp); letter-spacing:0; background:var(--pa); color:#1A1A1A; box-shadow:inset 0 0 0 1.5px #1A1A1A; transition:transform .2s var(--ease-o),box-shadow .2s,background .2s; }
.hw .hbtn:hover{ transform:translateY(-2px); background:var(--pa-h); box-shadow:inset 0 0 0 1.5px #1A1A1A,0 3px 0 0 #1A1A1A; }
.hw .hbtn:active{ transform:scale(.97); }
.hw .hbtn.lg{ height:52px; padding:0 24px; font-size:16.5px; border-radius:12px; }
.hw .hbtn.light{ background:var(--c-lt); color:var(--c-ink); }
.hw .hbtn .icon{ width:16px; height:16px; }
.hw .ghost{ display:inline-flex; align-items:center; gap:10px; height:52px; padding:0 8px; font:500 16px/1 var(--f-disp); color:var(--c-ink); }
.hw .ghost .play{ display:grid; place-items:center; width:32px; height:32px; border-radius:50%; background:var(--c-card); box-shadow:0 0 0 1px var(--c-line),0 4px 12px -6px rgba(0,0,0,.3); transition:transform .25s var(--ease-o); }
.hw .ghost:hover .play{ transform:scale(1.08); }
.hw-nav.on-dark .hbtn{ background:var(--pa); color:#1A1A1A; }
.hw .hbtn:focus-visible, .hw .ghost:focus-visible, .hw-nav a:focus-visible{ outline:2px solid var(--c-ink); outline-offset:3px; }


/* ---------- hero ---------- */
.hw-hero{ position:relative; padding-top:clamp(40px,7vh,84px); isolation:isolate; }
.hw-hero .top{ position:relative; z-index:2; display:grid; justify-items:center; text-align:center; gap:22px; }
.hw-hero h1{ font-size:clamp(58px,9vw,138px); line-height:.92; letter-spacing:-.022em; max-width:12ch; }
.hw-hero h1 .w{ display:inline-block; white-space:pre; animation:wordin .9s var(--ease-o) both; animation-delay:calc(.05s + var(--i) * .06s); }
@keyframes wordin{ from{ opacity:0; transform:translateY(.28em); filter:blur(12px); } }
.hw-hero .sub{ max-width:38rem; font-size:clamp(17px,1.45vw,20px); line-height:1.5; color:var(--c-2); letter-spacing:0; animation:wordin 1s .35s var(--ease-o) both; }
.hw-hero .cta{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; justify-content:center; animation:wordin 1s .45s var(--ease-o) both; }
.hw-hero .n1{ left:calc(50% - 480px); top:calc(100% - 62px); transform:rotate(-6deg); }
.hw-hero .n2{ left:calc(50% + 196px); top:calc(100% - 10px); transform:rotate(4deg); z-index:3; }

/* the ring: posts on the inside of a cylinder, like a feed seen from within */
.c3d{ position:relative; height:clamp(480px,calc(52vh + 60px),600px); margin-top:calc(clamp(28px,5vh,56px) - 60px); perspective:1100px; perspective-origin:50% 42%; cursor:grab; touch-action:pan-y; user-select:none; -webkit-user-select:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent); mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent); }
.c3d.drag{ cursor:grabbing; }
.c3d .stage{ position:absolute; left:50%; top:0; width:0; height:100%; transform-style:preserve-3d; }
.c3d .cc{ position:absolute; left:-160px; top:100px; width:320px; transform-style:preserve-3d; will-change:transform; backface-visibility:hidden; border-radius:18px; }
.c3d .cc .xp{ width:400px; zoom:.8; border-radius:22px; border:0; box-shadow:0 0 0 1px rgba(26,26,26,.06),0 30px 50px -30px rgba(26,26,26,.35),0 6px 14px -8px rgba(26,26,26,.12); padding:14px 16px 6px; }
.c3d .cc .xp .md{ aspect-ratio:800/474; }
.c3d .cc .xp .acts{ max-width:none; }
.c3d .cc .hchip{ position:absolute; left:50%; top:-40px; z-index:2; transform:translate(-50%,6px) scale(.9); opacity:0; display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 12px 0 6px; border-radius:99px; background:var(--c-ink); color:#fff; font:600 13px/1 var(--f-disp); white-space:nowrap; box-shadow:0 10px 24px -10px rgba(0,0,0,.6); transition:opacity .35s,transform .45s var(--ease-o); z-index:2; }
.c3d .cc .hchip b{ display:grid; place-items:center; min-width:22px; height:22px; padding:0 5px; border-radius:99px; background:var(--c-mark); color:var(--c-ink); font:600 12px/1 var(--font-mono); }
.c3d .cc.stop .hchip{ opacity:1; transform:translate(-50%,0) scale(1); }
.c3d .cc .xp .tx .first{ background:linear-gradient(transparent 60%, var(--c-mark) 60%, var(--c-mark) 94%, transparent 94%) no-repeat 0 0 / 0% 100%; transition:background-size .7s .15s var(--ease-o); }
.c3d .cc.stop .xp .tx .first{ background-size:100% 100%; }
.ring-cap{ text-align:center; font-size:12.5px; color:var(--c-3); margin-top:6px; }

/* ---------- chapters ---------- */
.hw-sec{ padding-top:clamp(110px,14vw,190px); }
.hw .hw-h{ display:grid; gap:clamp(22px,2.2vw,32px); max-width:52rem; margin-bottom:clamp(40px,5vw,64px); }
.hw .hw-h.c{ margin-inline:auto; text-align:center; justify-items:center; }
.hw-h h2{ font-size:clamp(46px,6.2vw,92px); line-height:1.04; }
.hw-h p{ font-size:clamp(17px,1.4vw,20px); color:var(--c-2); max-width:36rem; letter-spacing:0; }
.rv{ transition:opacity .9s var(--ease-o),transform .9s var(--ease-o),filter .9s var(--ease-o); transition-delay:var(--d,0s); }
.rv.armed{ opacity:0; transform:translateY(28px); filter:blur(10px); }
/* chapter heads: the headline wipes up out of its own baseline, the line under it follows */
.hw-h.rv, .hw-h.rv.armed{ opacity:1; transform:none; filter:none; }
.hw-h.rv h2{ transition:clip-path 1.1s var(--ease-o),transform 1.1s var(--ease-o); clip-path:inset(-10% -5% -20% -5%); }
.hw-h.rv.armed h2{ clip-path:inset(-10% -5% 100% -5%); transform:translateY(.35em); }
.hw-h.rv p, .hw-h.rv .bill2{ transition:opacity .9s .18s var(--ease-o),transform .9s .18s var(--ease-o); }
.hw-h.rv.armed p, .hw-h.rv.armed .bill2{ opacity:0; transform:translateY(14px); }
/* demos: rise out of the page like a device set on a table */
.wk.rv.armed, .crx.rv.armed, .pl-grid.rv.armed, .cards.rv.armed{ transform:perspective(1400px) translateY(70px) rotateX(9deg) scale(.97); filter:none; }
.wk.rv, .crx.rv, .pl-grid.rv, .cards.rv{ transform-origin:50% 0; transition-duration:1.2s; }
/* four feeds: the phones come up one after another */
.four2.rv, .four2.rv.armed{ opacity:1; transform:none; filter:none; }
.four2.rv .ph{ transition:opacity .9s var(--ease-o),translate 1.2s var(--ease-o); }
.four2.rv .ph:nth-child(2){ transition-delay:.08s; } .four2.rv .ph:nth-child(3){ transition-delay:.16s; } .four2.rv .ph:nth-child(4){ transition-delay:.24s; }
.four2.rv.armed .ph{ opacity:0; translate:0 110px; }

/* ---------- the keynote: a draft becomes a hook (pinned, scroll-scrubbed) ---------- */
.story{ position:relative; height:520vh; background:var(--c-dark); color:var(--c-lt); margin-top:clamp(90px,11vw,150px);
  /* the chapter arrives as an inset sheet and opens to full bleed as it reaches the top */
  clip-path:inset(0 calc((1 - var(--in,1)) * 5vw) round calc((1 - var(--in,1)) * 40px)); }
.story .pin{ position:sticky; top:0; height:100vh; height:100dvh; overflow:hidden; display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr); align-items:center; gap:clamp(24px,4vw,64px); padding-inline:max(16px,calc((100vw - 1200px)/2 + 40px)); }
.story .pin::before{ content:none; }
.story .caps{ position:relative; height:260px; }
.story .cap{ position:absolute; inset:0; display:grid; align-content:center; gap:16px; opacity:0; transform:translateY(24px); filter:blur(8px); transition:opacity .5s var(--ease-o),transform .6s var(--ease-o),filter .5s var(--ease-o); }
.story .cap.on{ opacity:1; transform:none; filter:none; }
.story .cap h3{ font-family:var(--f-serif); font-weight:400; font-size:clamp(38px,4vw,62px); line-height:1.06; margin-bottom:18px; letter-spacing:-.015em; }
.story .cap p{ font-size:18px; color:rgba(254,253,241,.84); max-width:26rem; }
.story .prog{ position:absolute; left:0; bottom:-40px; display:flex; gap:6px; }

function springEase(stiffness, damping, mass = 1) {
  const w0 = Math.sqrt(stiffness / mass), z = damping / (2 * Math.sqrt(stiffness * mass));
  const wd = w0 * Math.sqrt(Math.max(1e-6, 1 - z * z));
  const x = t => z < 1 ? 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)) : 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  let T = 0.1; for (let t = 0; t < 3; t += 1 / 240) if (Math.abs(1 - x(t)) > 0.006) T = t;

  for (let i = 0; i <= n; i++) pts.push(+x(T * i / n).toFixed(4));

})();

function heatmap() {
  const r = rng(RANGE); const cols = ['6a', '9a', '12p', '3p', '6p', '9p']; const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const val = (di, ci) => clamp((ci === 1 ? .7 : ci === 2 ? .55 : ci === 4 ? .5 : .22) + (di === 1 && ci === 1 ? .3 : 0) + (di >= 5 ? -.15 : 0) + (di === 3 && ci === 2 ? .25 : 0) + (r() - .5) * .2, .06, 1);
  return `<div class="heat" role="img" aria-label="Heatmap of first-hour replies by day and time. Peak is Tuesday 9am."><span></span>${cols.map(c => `<span class="cl">${c}</span>`).join('')}${days.map((d, di) => `<span class="rl">${d}</span>${cols.map((c, ci) => { const v = val(di, ci); return `<span class="c" style="opacity:${(.12 + v * .88).toFixed(2)}" data-tip="${d} ${c}: ${Math.round(v * 48)} replies/hr avg"></span>`; }).join('')}`).join('')}</div>`;
}
function lineChart(host, data) {
  const W = 720, H = 220, pl = 44, pr = 16, pt = 12, pb = 26; const ticks = niceTicks(Math.max(...data)); const nice = ticks[ticks.length - 1]; const n = data.length;
  const x = i => pl + (W - pl - pr) * (n === 1 ? 0 : i / (n - 1)), y = v => pt + (H - pt - pb) * (1 - v / nice);
  const pts = data.map((v, i) => [x(i), y(v)]); const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const step = n > 60 ? 14 : n > 20 ? 7 : 1;
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Impressions per day, last ${n} days, ending at ${fmtK(data[n - 1])}"><defs><linearGradient id="areaFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
  <g class="grid">${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/>`).join('')}</g>
  <g class="axis">${ticks.map(t => `<text x="${pl - 8}" y="${y(t) + 3.5}" text-anchor="end">${fmtK(t)}</text>`).join('')}${data.map((v, i) => { if ((n - 1 - i) % step) return ''; const dt = new Date(Date.now() - (n - 1 - i) * DAY); return `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === n - 1 ? 'end' : 'middle'}">${MON[dt.getMonth()]} ${dt.getDate()}</text>`; }).join('')}</g>
  <path class="area" d="${path} L${x(n - 1)} ${y(0)} L${x(0)} ${y(0)} Z"/><path class="ln draw" d="${path}"/>
  <circle class="endpt" cx="${pts[n - 1][0]}" cy="${pts[n - 1][1]}" r="4.5"/>
  <g id="hover" style="display:none"><line class="cross" y1="${pt}" y2="${H - pb}"/><circle class="endpt" r="4.5"/></g>
  <rect x="${pl}" y="0" width="${W - pl - pr}" height="${H}" fill="transparent" id="hit"/></svg><div class="chart-tip" style="opacity:0"></div>`;
  const ln = $('.ln', host); const len = ln.getTotalLength(); ln.style.setProperty('--len', len);
  const svg = $('svg', host), hov = $('#hover', host), tip = $('.chart-tip', host);
  const move = e => {
    const r = svg.getBoundingClientRect(); const sx = (e.clientX - r.left) / r.width * W; const i = clamp(Math.round((sx - pl) / (W - pl - pr) * (n - 1)), 0, n - 1);
    hov.style.display = ''; $('line', hov).setAttribute('x1', x(i)); $('line', hov).setAttribute('x2', x(i)); $('circle', hov).setAttribute('cx', x(i)); $('circle', hov).setAttribute('cy', y(data[i]));
    const dt = new Date(Date.now() - (n - 1 - i) * DAY);
    tip.innerHTML = `<b>${data[i].toLocaleString()}</b><span class="faint">${DOW[dt.getDay()]}, ${MON[dt.getMonth()]} ${dt.getDate()}</span>`; tip.style.opacity = 1;
    tip.style.left = clamp(x(i) / W * r.width, 60, r.width - 60) + 'px'; tip.style.top = (y(data[i]) / H * r.height + 20) + 'px';
  };
  $('#hit', host).addEventListener('pointermove', move); $('#hit', host).addEventListener('pointerleave', () => { hov.style.display = 'none'; tip.style.opacity = 0; });
}

  </div></div>`);
  const drawNever = () => { $('#never').innerHTML = S.voice.never.map((w, i) => `<span class="w no">${esc(w)}<button data-nv="${i}" aria-label="Allow ${esc(w)}" data-tip="Allow again">${ic('x', 'xs')}</button></span>`).join('') || '<span class="faint" style="font-size:13px">No banned words. Brave.</span>'; };
  const sample = () => { const s = $('#v-sample'); s.style.opacity = .3; setTimeout(() => { s.textContent = voiceSample(S.voice.spice, S.voice.polish, S.voice.length); s.style.opacity = 1; }, 120); };
  drawNever(); $('#v-sample').textContent = voiceSample(S.voice.spice, S.voice.polish, S.voice.length);
  const v = $('#view'); const deb = debounce(sample, 60);
  v.addEventListener('input', e => { const k = e.target.dataset.v; if (!k) return; S.voice[k] = +e.target.value; e.target.style.setProperty('--p', e.target.value + '%'); $(`#v-${k}-n`).textContent = e.target.value; save(); deb(); });
  v.addEventListener('click', e => { const b = e.target.closest('[data-nv]'); if (b) { const [w] = S.voice.never.splice(+b.dataset.nv, 1); save(); drawNever(); toast(`“${esc(w)}” is allowed again.`, { icon: 'check' }); } });
  $('#never-f').onsubmit = e => { e.preventDefault(); const i = $('#never-in'); const w = i.value.trim(); if (!w) { i.setAttribute('aria-invalid', 'true'); i.focus(); return; } i.removeAttribute('aria-invalid'); if (S.voice.never.includes(w.toLowerCase())) { toast('Already banned.', { icon: 'check' }); return; } S.voice.never.push(w.toLowerCase()); save(); i.value = ''; drawNever(); toast(`Hookworthy will never say “${esc(w)}”.`, { icon: 'zapoff', tone: 'accent' }); };
  $('#retrain').onclick = e => { const b = e.currentTarget; b.classList.add('is-loading'); setTimeout(() => { b.classList.remove('is-loading'); S.voice.spice = Math.min(100, S.voice.spice + 4); save(); route(); toast('Retrained on 214 posts. You got 4% spicier.', { icon: 'voice', tone: 'accent' }); }, 1400); };
};
