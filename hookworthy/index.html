/* ==========================================================================
   BASE
   ========================================================================== */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg); color:var(--text-1);
  font:400 var(--t-14)/1.5 var(--font-ui); letter-spacing:0;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
body.on-dark{ background:#1A1A1A; }
::selection{ background:var(--marker); color:var(--marker-ink); }
.force-dark ::selection{ background:rgba(255,255,255,.2); }
img{ max-width:100%; display:block; }
button,input,textarea,select{ font:inherit; color:inherit; letter-spacing:inherit; }
button{ cursor:pointer; background:none; border:0; padding:0; }
a{ color:inherit; text-decoration:none; }
:focus:not(:focus-visible){ outline:none; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r-sm); }
:is(.tw-input,.handle-in input,.hero-handle input,.capture textarea,#grader-t,.cmdk-in input,[tabindex="-1"]):focus-visible{ outline:none; box-shadow:none; }
@media (forced-colors:active){ :focus-visible{ outline:2px solid Highlight !important; } .seg .seg-thumb{ forced-color-adjust:none; outline:1px solid Highlight; } .switch[aria-checked="true"]{ outline:2px solid Highlight; } }
[hidden]{ display:none!important; }
.sr{ position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.num,.mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; letter-spacing:0; }
.tnum{ font-variant-numeric:tabular-nums; }
.icon{ width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.icon.sm{ width:16px; height:16px; } .icon.xs{ width:14px; height:14px; } .icon.lg{ width:24px; height:24px; }
.display{ margin:0; font-family:var(--font-display); font-weight:400; letter-spacing:-.012em; line-height:1.02; text-wrap:balance; hanging-punctuation:first last; font-feature-settings:"liga","dlig","onum"; }
.display em, .display .mk{ font-style:italic; background:var(--psq) no-repeat 0 100% / 100% .24em; padding:0 .02em .08em; margin:0; -webkit-box-decoration-break:clone; box-decoration-break:clone; animation:mkin .8s .25s var(--ease-out) both; }
@keyframes mkin{ from{ background-size:0% .24em; } }
.h1{ font:400 40px/1.05 var(--font-display); letter-spacing:-.01em; text-wrap:balance; margin:0; }
.h2{ font:600 19px/1.25 var(--font-ui); letter-spacing:0; text-wrap:balance; margin:0; }
.h3{ font:600 var(--t-15)/1.35 var(--font-ui); letter-spacing:0; margin:0; }
.label{ font:500 var(--t-12)/1.2 var(--font-ui); letter-spacing:0; color:var(--text-3); }
.muted{ color:var(--text-2); } .faint{ color:var(--text-3); } .accent{ color:var(--accent-text); }
p{ margin:0; }

kbd,.kbd{ display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px; font:500 var(--t-11)/1 var(--font-mono); color:var(--text-2); background:var(--surface-2); border:1px solid var(--border); border-radius:5px; letter-spacing:0; }
.kbds{ display:inline-flex; gap:3px; }

/* ==========================================================================
   COMPONENTS
   states: :hover, :focus-visible, :active, [disabled], .is-loading
   ========================================================================== */
.btn{
  --bh:34px; position:relative; display:inline-flex; align-items:center; justify-content:center; gap:7px;
  height:var(--bh); padding:0 14px; border-radius:10px;
  font:500 var(--t-14)/1 var(--font-ui); letter-spacing:0; white-space:nowrap;
  color:var(--text-1); background:var(--surface); box-shadow:0 0 0 1px var(--border-strong),var(--sh-1);
  transition:background var(--d-micro) var(--ease-out),box-shadow var(--d-micro) var(--ease-out),transform var(--d-spring) var(--spring-snap),color var(--d-micro),opacity var(--d-micro);
  user-select:none; -webkit-tap-highlight-color:transparent; will-change:transform;
}
.btn:hover{ background:var(--surface-2); }
.btn:active{ transform:scale(.965); transition-duration:80ms; }
.btn:focus-visible{ box-shadow:var(--focus); }
.btn[disabled],.btn.is-disabled{ opacity:.4; pointer-events:none; }
.btn .icon{ margin-inline:-2px; }
.btn.sm{ --bh:28px; padding:0 11px; font-size:var(--t-13); gap:6px; }
.btn.lg{ --bh:42px; padding:0 20px; font-size:var(--t-15); }
.btn.xl{ --bh:50px; padding:0 26px; font-size:var(--t-17); }
.btn.icon-only{ width:var(--bh); padding:0; }
.btn.primary{ color:var(--btn-ink); background:var(--btn-bg); font-weight:600; box-shadow:inset 0 0 0 1px var(--btn-line); }
.btn.primary:hover{ background:var(--btn-hover); transform:translateY(-1px); box-shadow:inset 0 0 0 1px var(--btn-line),0 3px 0 -1px var(--btn-line); }
.btn.primary:focus-visible{ box-shadow:var(--focus); }
.btn.ink{ color:var(--text-inv); background:var(--text-1); box-shadow:0 1px 2px rgba(0,0,0,.2),inset 0 -1px 0 rgba(0,0,0,.1); }
.btn.ink:hover{ background:color-mix(in srgb,var(--text-1) 88%,var(--bg)); }
.btn.ghost{ background:transparent; box-shadow:none; color:var(--text-2); }
.btn.ghost:hover{ background:var(--surface-2); color:var(--text-1); }
.btn.danger{ color:var(--error); } .btn.danger:hover{ background:var(--error-soft); }
.btn.is-loading{ color:transparent!important; pointer-events:none; }
.btn.is-loading::after{ content:""; position:absolute; inset:0; margin:auto; width:16px; height:16px; border-radius:50%; border:2px solid currentColor; border-color:var(--text-2) transparent var(--text-2) transparent; animation:spin .7s linear infinite; }

.diff-b .chg.off .nl-ins,.diff-b .chg:not(.off) .nl-del{ display:none; }

.delta{ font:600 var(--t-12)/1 var(--font-ui); font-variant-numeric:tabular-nums; white-space:nowrap; }

.add-tw{ display:flex; align-items:center; gap:14px; width:100%; padding:6px 0; color:var(--text-3); font-size:var(--t-14); border-radius:10px; transition:color var(--d-micro); }

.pv-close{ color:var(--text-2); padding-inline:8px 10px; gap:4px; }

.pv{ border-radius:16px; background:var(--surface); box-shadow:0 0 0 1px var(--border),var(--sh-1); overflow:hidden; }
/* the draft, in the feed: the platform's own surface, real neighbours above and below */

.pf .poll-pv{ margin-top:12px; display:grid; gap:8px; }

.pv-proj{ margin:0; padding:9px 12px; border-top:1px solid var(--border); font:400 var(--t-12)/1.4 var(--font-ui); color:var(--text-3); }

/* ==========================================================================
   IDEAS / HOOKS / QUEUE / INSIGHTS / VOICE
   ========================================================================== */
.capture{ position:relative; border-radius:18px; background:var(--surface); box-shadow:0 0 0 1px var(--border-strong),var(--sh-2); padding:4px; transition:box-shadow var(--d-fast); }

.capture textarea{ width:100%; min-height:64px; border:0; resize:none; background:transparent; padding:14px 14px 6px; font:400 var(--t-17)/1.5 var(--font-ui); }
.capture-f{ display:flex; align-items:center; gap:4px; padding:4px 6px 4px 8px; flex-wrap:wrap; }

.drop-hint{ position:absolute; inset:0; border-radius:18px; display:grid; place-items:center; background:color-mix(in srgb,var(--surface) 90%,transparent); box-shadow:inset 0 0 0 2px var(--accent); font-weight:600; color:var(--accent-text); z-index:2; animation:fade var(--d-fast) both; }

.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.grid-3{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,272px),1fr)); gap:14px; }
.sec{ margin-top:44px; }
.idea-tabs{ margin-top:28px; display:flex; }
.radar{ margin-top:20px; }
.radar-h{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
.trends{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:16px; }
.trend{ display:grid; gap:4px; align-content:start; padding:14px 16px; border-radius:14px; background:var(--surface); box-shadow:0 0 0 1px var(--border); }
.trend b{ font-weight:600; letter-spacing:0; } .trend .d{ font:600 var(--t-13)/1 var(--font-mono); color:var(--success); } .trend small{ color:var(--text-3); font-size:var(--t-12); }
.trend.early{ box-shadow:0 0 0 1.5px var(--text-1); }
.trend.early b{ background:linear-gradient(transparent 60%,var(--marker) 60%,var(--marker) 92%,transparent 92%); justify-self:start; }
.trend .btn{ justify-self:start; margin-top:8px; }
.radar-list{ display:grid; gap:14px; margin-top:18px; }
.rpost{ display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); border-radius:18px; background:var(--surface); box-shadow:0 0 0 1px var(--border); overflow:hidden; animation:rise .5s var(--d,0s) var(--ease-out) both; }
.rp-post .xp{ border:0; height:100%; }

/* pastel coding: kinds of post and reasons a post spread. Color is a label here, never decoration. */
.kp{ box-shadow:none; }
.kp[data-kind="contrarian"], .rp-why .tag[data-t="hook"]{ background:var(--p-peach); color:var(--p-peach-ink); }
.kp[data-kind="story"], .kp[data-kind="question"], .rp-why .tag[data-t="promise"], .rp-why .tag[data-t="relatable"]{ background:var(--p-peri); color:var(--p-peri-ink); }

/* a soft wash behind every page title, the same sky as the homepage */

.rp-pat p{ margin-top:6px; font-size:var(--t-13); line-height:1.5; white-space:pre-line; color:var(--text-1); }

.sec-h{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }

.idea{ padding:16px; display:grid; gap:14px; align-content:space-between; text-align:left; }
.idea .t{ font:500 var(--t-15)/1.45 var(--font-ui); text-wrap:pretty; }
.idea .f{ display:flex; align-items:center; gap:8px; justify-content:space-between; }
.angles{ display:grid; gap:8px; margin-top:14px; }
.angle{ display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; padding:12px 12px 12px 16px; animation:rise var(--d-snap) var(--ease-out) both; }
.angle .k{ font:600 var(--t-12)/1.2 var(--font-ui); color:var(--text-3); width:86px; }
.starters-t{ font:500 var(--t-13)/1.3 var(--font-ui); color:var(--text-3); }
.angle p{ font-size:var(--t-15); line-height:1.45; }
.inbox{ display:grid; }
.inbox-row{ display:grid; grid-template-columns:32px 1fr auto; gap:12px; align-items:center; padding:11px 10px; border-radius:10px; transition:background var(--d-micro); }

.bars{ display:grid; gap:9px; }

.hk{ padding:16px; display:grid; gap:14px; align-content:space-between; }

.cal-h{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
.cal-h .range{ font:600 var(--t-15)/1 var(--font-ui); letter-spacing:0; margin-left:8px; }
.cal-wrap{ display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:18px; align-items:start; }
.cal{ display:grid; grid-template-columns:70px repeat(7,minmax(0,1fr)); border-radius:14px; background:var(--surface); box-shadow:0 0 0 1px var(--border); overflow:hidden; }
.cal .dh{ padding:12px 10px 10px; border-bottom:1px solid var(--border); border-left:1px solid var(--border); display:grid; gap:3px; }
.cal .dh:first-child{ border-left:0; }

.cal .dh .dd{ font:600 var(--t-24)/1 var(--font-ui); letter-spacing:0; font-variant-numeric:lining-nums; }
.cal .dh.today .dd,.cal .dh.today .dn{ color:var(--accent-text); }
.cal .tl{ white-space:nowrap; padding:10px 8px; font:500 var(--t-11)/1 var(--font-mono); color:var(--text-3); text-align:right; border-top:1px solid var(--border); }
.slot{ position:relative; min-height:92px; padding:6px; border-top:1px solid var(--border); border-left:1px solid var(--border); transition:background var(--d-micro); }
.slot.past{ background:color-mix(in srgb,var(--surface-2) 55%,transparent); }
.slot.best{ padding-top:16px; } .slot{ padding-top:16px; }
.slot.best::before{ content:""; position:absolute; top:6px; left:50%; margin-left:-3px; width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.slot.over{ background:var(--accent-soft); box-shadow:inset 0 0 0 1.5px var(--accent); }
.slot .add{ position:absolute; inset:6px; border-radius:10px; display:grid; place-items:center; color:var(--text-3); opacity:0; transition:opacity var(--d-micro),background var(--d-micro); font-size:var(--t-12); }
.slot:hover .add,.slot .add:focus-visible{ opacity:1; background:var(--surface-2); }
.qcard{ position:relative; z-index:1; display:grid; gap:6px; padding:8px 9px; border-radius:9px; background:var(--bg-elev); box-shadow:0 0 0 1px var(--border-strong); cursor:grab; font-size:var(--t-12); line-height:1.35; text-align:left; width:100%; min-width:0; overflow:hidden; transition:transform var(--d-spring) var(--spring),box-shadow var(--d-fast); }
.force-dark .qcard,:root[data-theme="dark"] .qcard:not(.force-light .qcard){ background:var(--surface-2); }
.qcard:hover{ box-shadow:0 0 0 1px var(--accent),var(--sh-2); transform:translateY(-1px); }
.qcard.drag{ opacity:.4; }
.qcard.landed{ animation:land var(--d-snap) var(--spring-snap); }

.qcard p{ overflow-wrap:anywhere; min-width:0; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; color:var(--text-1); }
.qcard .qm{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:2px 6px; color:var(--text-3); font-family:var(--font-mono); font-size:10.5px; }
.qcard .qp{ display:flex; gap:3px; }
.qcard .qp svg{ width:13px; height:13px; } .qcard .qp{ color:var(--text-2); }
.qcard.published{ opacity:.6; }
.qcard.due{ box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--warn) 60%,transparent); } .qcard.due .qm > span:first-child::before{ content:"Post by hand · "; font:600 11px/1 var(--font-ui); color:var(--text-1); letter-spacing:0; }
.qcard.published .qm > span:first-child::before{ content:"Sent · "; font:600 10px/1 var(--font-ui); color:var(--success); letter-spacing:0; }
.side-panel{ display:grid; gap:12px; }
.side-panel .card{ padding:16px; display:grid; gap:12px; }
.setting{ display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center; }

.upnext a:hover, .upnext button:hover{ background:var(--surface-2); }

.agenda{ display:none; }
.ag-day{ display:grid; gap:8px; padding:14px 0; border-bottom:1px solid var(--border); }
.ag-day h3{ display:flex; align-items:baseline; gap:8px; margin:0; font:600 var(--t-24)/1.1 var(--font-ui); letter-spacing:0; }
.ag-day h3 span{ font:500 var(--t-12)/1 var(--font-ui); color:var(--text-3); }
.ag-day.today h3,.ag-day.today h3 span{ color:var(--accent-text); }
.ag-open{ display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border-radius:12px; box-shadow:inset 0 0 0 1px var(--border); color:var(--text-2); font-size:var(--t-13); text-align:left; background:var(--bg-elev); }
.ag-open .dot{ color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.ag-open b{ margin-left:auto; color:var(--text-1); font-weight:500; display:inline-flex; gap:4px; align-items:center; }
.agenda .qcard{ cursor:pointer; font-size:var(--t-14); padding:12px; }

.insight-hero{ padding:36px; border-radius:20px; position:relative; overflow:hidden; background:var(--surface); box-shadow:0 0 0 1px var(--border); }

.ot-diff .vw{ background:var(--marker-soft); border-radius:3px; box-shadow:0 0 0 1px var(--marker-soft); }
.ot-why{ font-size:13px; }
.onb-result > *{ animation:rise var(--d-slow) var(--ease-out) both; }
.onb-result > *:nth-child(2){ animation-delay:80ms } .onb-result > *:nth-child(3){ animation-delay:160ms }
.onb-result .grid{ display:grid; grid-template-columns:320px 1fr; gap:14px; align-items:start; }
.voice-card{ padding:20px; display:grid; gap:14px; position:sticky; top:20px; }
.post-ideas{ display:grid; gap:10px; }
.pidea{ display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center; padding:16px 16px 16px 18px; text-align:left; animation:rise var(--d-slow) var(--ease-out) both; }
.pidea p{ font:400 var(--t-15)/1.5 var(--font-ui); white-space:pre-wrap; }
.pidea .f{ display:flex; gap:8px; margin-top:10px; align-items:center; }
.timer{ font:500 var(--t-12)/1 var(--font-mono); color:var(--text-3); display:inline-flex; gap:6px; align-items:center; }

/* ==========================================================================
   PLATFORM POSTS: renders that match each app's real feed UI.
   X, Threads, LinkedIn and Bluesky, light and dark. Used by the homepage and
   by the composer's "In the feed" preview, so what you see is what ships.
   ========================================================================== */
.pf{ --pf-sys:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; text-align:left; -webkit-font-smoothing:antialiased; }
.pf img{ display:block; }
.pf .av{ border-radius:50%; object-fit:cover; background:#CFD9DE; flex:none; }
.pf .av.ini{ display:grid; place-items:center; color:#fff; font:700 15px/1 var(--pf-sys); background:linear-gradient(135deg,#8B98A5,#536471); }
.av.ini{ position:relative; overflow:hidden; }
.av .avp{ position:absolute; inset:0; border-radius:inherit; background:var(--spr-av) no-repeat 0 0 / 100% 1800%; }
.no-spr .pf .md, .no-spr .avp:not(.avp2), .no-spr2 .avp2{ display:none; }
.av .avp2{ background:var(--spr-av2) no-repeat 0 0 / 100% 600%; }
.pf .md .mdp{ display:block; width:100%; height:100%; background:var(--spr-ph) no-repeat 0 0 / 100% 600%; }
.pf .ic{ width:18.75px; height:18.75px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; flex:none; }

/* ---------------- X ---------------- */
.xp{ --x-bg:#FFFFFF; --x-tx:#0F1419; --x-2:#536471; --x-line:#EFF3F4; --x-media:#CFD9DE; --x-blue:#1D9BF0; --x-hover:rgba(15,20,25,.03);
  display:grid; grid-template-columns:40px minmax(0,1fr); gap:0 8px; padding:12px 16px 4px; background:var(--x-bg); color:var(--x-tx); font:400 15px/20px var(--pf-sys); border-bottom:1px solid var(--x-line); }
.xp.dark{ --x-bg:#000000; --x-tx:#E7E9EA; --x-2:#71767B; --x-line:#2F3336; --x-media:#2F3336; --x-hover:rgba(231,233,234,.03); }
.xp .av{ width:40px; height:40px; }
.xp .hd{ display:flex; align-items:center; gap:4px; min-width:0; line-height:20px; }
.xp .hd .n{ font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.xp .hd .h, .xp .hd .t, .xp .hd .xdot{ color:var(--x-2); white-space:nowrap; }
.xp .hd .h{ overflow:hidden; text-overflow:ellipsis; min-width:0; }
.xp .hd .more{ margin-left:auto; color:var(--x-2); display:grid; place-items:center; width:18.75px; }
.xp .vb{ width:18.75px; height:18.75px; flex:none; }
.xp .tx{ margin-top:2px; white-space:pre-wrap; overflow-wrap:anywhere; }
.xp .tx a, .xp .tx .lnk{ color:var(--x-blue); }
.xp .tx .showmore{ display:block; color:var(--x-blue); margin-top:2px; }
.xp .md{ margin-top:12px; border-radius:16px; overflow:hidden; border:1px solid var(--x-media); aspect-ratio:800/474; background:var(--x-media); }
.xp .md img{ width:100%; height:100%; object-fit:cover; }
.xp .acts{ display:flex; justify-content:space-between; align-items:center; max-width:425px; margin:12px 0 0 -8px; height:32px; color:var(--x-2); font-size:13px; line-height:16px; }
.xp .acts .a{ display:inline-flex; align-items:center; gap:2px; min-width:0; }
.xp .acts .a .b{ display:grid; place-items:center; width:34px; height:34px; border-radius:50%; transition:background .2s,color .2s; }
.xp .acts .a span.c{ padding:0 4px 0 1px; font-variant-numeric:tabular-nums; }
.xp .acts .a.rp:hover{ color:#1D9BF0; } .xp .acts .a.rp:hover .b{ background:rgba(29,155,240,.1); }
.xp .acts .a.rt:hover{ color:#00BA7C; } .xp .acts .a.rt:hover .b{ background:rgba(0,186,124,.1); }
.xp .acts .a.lk:hover{ color:#F91880; } .xp .acts .a.lk:hover .b{ background:rgba(249,24,128,.1); }
.xp .acts .a.lk.on{ color:#F91880; } .xp .acts .a.lk.on .ic{ fill:#F91880; stroke:#F91880; }
.xp .acts .a.vw:hover{ color:#1D9BF0; } .xp .acts .a.vw:hover .b{ background:rgba(29,155,240,.1); }
.xp .acts .tail{ display:flex; gap:0; }
.xp.xthr{ border-bottom:0; padding-bottom:0; }
.xp .rail{ display:grid; justify-items:center; grid-template-rows:40px 1fr; }
.xp .rail i{ width:2px; margin-top:4px; background:var(--x-media); border-radius:2px; }
.xp.cc{ border:1px solid var(--x-line); border-radius:16px; }

/* ---------------- Threads ---------------- */
.thp{ --t-bg:#FFFFFF; --t-tx:#000000; --t-2:#707070; --t-line:rgba(0,0,0,.15); --t-rail:rgba(0,0,0,.15);
  display:grid; grid-template-columns:48px minmax(0,1fr); gap:0 0; padding:12px 16px 10px; background:var(--t-bg); color:var(--t-tx); font:400 15px/21px var(--pf-sys); border-bottom:1px solid var(--t-line); }
.thp.dark{ --t-bg:#101010; --t-tx:#F3F5F7; --t-2:#777777; --t-line:rgba(243,245,247,.15); --t-rail:rgba(243,245,247,.15); }
.thp .av{ width:36px; height:36px; margin-top:4px; }
.thp .hd{ display:flex; align-items:center; gap:6px; }
.thp .hd .n{ font-weight:600; }
.thp .hd .t{ color:var(--t-2); }
.thp .hd .more{ margin-left:auto; color:var(--t-tx); }
.thp .tx{ margin-top:1px; white-space:pre-wrap; overflow-wrap:anywhere; }
.thp .md{ margin-top:10px; border-radius:8px; overflow:hidden; aspect-ratio:800/474; max-width:340px; border:0.5px solid var(--t-line); }
.thp .md img{ width:100%; height:100%; object-fit:cover; }
.thp .acts{ display:flex; gap:4px; margin:8px 0 0 -8px; color:var(--t-tx); font-size:13px; }
.thp .acts .a{ display:inline-flex; align-items:center; gap:4px; height:36px; padding:0 8px; border-radius:18px; }
.thp .acts .ic{ width:20px; height:20px; stroke-width:1.9; }
.thp .acts .c{ color:var(--t-tx); opacity:.85; font-variant-numeric:tabular-nums; }
.thp.thr{ border-bottom:0; padding-bottom:0; }
.thp .rail{ display:grid; justify-items:center; grid-template-rows:36px 1fr; }
.thp .rail i{ width:2px; margin-top:6px; background:var(--t-rail); border-radius:2px; }

/* ---------------- LinkedIn ---------------- */
.lip{ --l-bg:#FFFFFF; --l-tx:rgba(0,0,0,.9); --l-2:rgba(0,0,0,.6); --l-line:#E8E8E8; --l-blue:#0A66C2; --l-page:#F4F2EE;
  background:var(--l-bg); color:var(--l-tx); font:400 14px/20px var(--pf-sys); border-radius:8px; box-shadow:0 0 0 1px rgba(140,140,140,.2); overflow:hidden; }
.lip.dark{ --l-bg:#1B1F23; --l-tx:rgba(255,255,255,.9); --l-2:rgba(255,255,255,.6); --l-line:#38434F; --l-blue:#71B7FB; box-shadow:0 0 0 1px rgba(255,255,255,.1); }
.lip .hd{ display:grid; grid-template-columns:48px minmax(0,1fr) auto; gap:8px; padding:12px 16px 0; align-items:start; }
.lip .av{ width:48px; height:48px; }
.lip .who{ min-width:0; }
.lip .who b{ display:flex; align-items:center; gap:4px; font-size:14px; line-height:20px; font-weight:600; }
.lip .who b .deg{ font-weight:400; color:var(--l-2); }
.lip .who span{ display:block; font-size:12px; line-height:16px; color:var(--l-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lip .follow{ display:inline-flex; align-items:center; gap:4px; color:var(--l-blue); font-weight:600; font-size:16px; padding:4px 8px; border-radius:4px; }
.lip .tx{ position:relative; padding:8px 16px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
/* clamp by height, not line-clamp: LinkedIn shows no ellipsis of its own, only the …more button */
.lip .tx.clamp{ max-height:calc(8px + var(--lh,20px) * var(--lines,3)); overflow:hidden; }
.lip .seemore{ display:block; text-align:right; padding:0 16px; margin-top:calc(-1 * var(--lh,20px)); position:relative; color:var(--l-2); font-size:inherit; line-height:var(--lh,20px); }
.lip .seemore span{ display:inline-block; background:linear-gradient(90deg,transparent,var(--l-bg) 22px); padding-left:26px; }
.lip .tx.clamp + .seemore{ top:-1px; }
.lip .md{ margin-top:8px; aspect-ratio:800/474; background:var(--l-line); }
.lip .md img{ width:100%; height:100%; object-fit:cover; }
.lip .soc{ display:flex; justify-content:space-between; align-items:center; padding:8px 16px; font-size:12px; color:var(--l-2); }
.lip .rx{ display:inline-flex; align-items:center; gap:4px; }
.lip .rx .ico{ display:inline-flex; }
.lip .rx .ico svg{ width:16px; height:16px; margin-right:-3px; border-radius:50%; box-shadow:0 0 0 1.5px var(--l-bg); }
.lip .bar{ display:flex; justify-content:space-around; border-top:1px solid var(--l-line); margin:0 16px; padding:4px 0; }
.lip .bar{ min-height:48px; }
.lip .bar span{ display:inline-flex; align-items:center; gap:6px; padding:12px 8px; font-weight:600; color:var(--l-2); font-size:14px; border-radius:4px; }
.lip .bar .ic{ width:20px; height:20px; }
/* narrow cards: LinkedIn's own mobile action bar (icon over label), so nothing forces the card wider than its column */
.lip{ container-type:inline-size; }
.lip .bar span{ min-width:0; }
@container (max-width:420px){ .lip .bar{ margin:0 8px; } .lip .bar span{ flex-direction:column; gap:2px; padding:8px 2px 6px; font-size:11.5px; font-weight:600; } .lip .bar .ic{ width:18px; height:18px; } .lip .follow{ font-size:14px; padding:4px 2px; } }

/* ---------------- Bluesky ---------------- */
.bsp{ --b-bg:#FFFFFF; --b-tx:#000000; --b-2:#405168; --b-ic:#56698A; --b-line:#DCE2EA; --b-blue:#006AFF;
  display:grid; grid-template-columns:42px minmax(0,1fr); gap:0 10px; padding:12px 15px 6px 18px; background:var(--b-bg); color:var(--b-tx); font:400 15px/1.3 Inter,var(--pf-sys); font-variant:no-contextual; border-bottom:1px solid var(--b-line); }
.bsp.dark{ --b-bg:#000000; --b-tx:#FFFFFF; --b-2:#A5B2C5; --b-ic:#667B99; --b-line:#232E3E; }
.bsp .av{ width:42px; height:42px; }
.bsp .hd{ display:flex; align-items:baseline; gap:4px; min-width:0; }
.bsp .hd .n{ font-weight:600; white-space:nowrap; }
.bsp .hd .h, .bsp .hd .t{ color:var(--b-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bsp .hd .n, .bsp .hd .t{ flex:none; } .bsp .hd .h{ min-width:0; }
.bsp .tx{ margin-top:2px; white-space:pre-wrap; overflow-wrap:anywhere; }
.bsp .md{ margin-top:10px; border-radius:8px; overflow:hidden; aspect-ratio:800/474; }
.bsp .md img{ width:100%; height:100%; object-fit:cover; }
.bsp .acts{ display:flex; justify-content:space-between; max-width:340px; margin-top:8px; color:var(--b-ic); font-size:13.1px; }
.bsp .acts .a{ display:inline-flex; align-items:center; gap:4px; height:30px; }
.bsp .acts .ic{ width:18px; height:18px; }

/* ---------------- phone frame + app chrome ---------------- */
.phone{ position:relative; width:var(--pw,320px); aspect-ratio:9/19.3; border-radius:calc(var(--pw,320px) * .16); padding:calc(var(--pw,320px) * .035); background:linear-gradient(145deg,#2A2B2E,#0C0C0D); box-shadow:inset 0 0 0 1.5px #3A3B3F, 0 40px 80px -30px rgba(0,0,0,.55), 0 12px 30px -12px rgba(0,0,0,.35); flex:none; }
.phone .scr{ position:relative; height:100%; border-radius:calc(var(--pw,320px) * .125); overflow:hidden; background:#fff; display:flex; flex-direction:column; container-type:inline-size; }
.phone .scr.dark{ background:#000; }
.phone .island{ position:absolute; top:9px; left:50%; width:30%; height:24px; margin-left:-15%; border-radius:20px; background:#000; z-index:5; }
.phone .sb{ display:flex; justify-content:space-between; align-items:center; height:44px; padding:10px 26px 0 30px; font:600 14px/1 var(--pf-sys); color:#000; flex:none; }
.phone .scr.dark .sb{ color:#fff; }
.phone .sb .ind{ display:flex; gap:5px; align-items:center; }
.phone .sb svg{ height:11px; width:auto; fill:currentColor; }
.phone .apph{ display:grid; grid-template-columns:32px 1fr 32px; align-items:center; height:44px; padding:0 14px; flex:none; }
.phone .apph .av{ width:30px; height:30px; }
.phone .apph .logo{ justify-self:center; width:22px; height:22px; }
.phone .tabs{ display:grid; grid-template-columns:1fr 1fr; height:44px; border-bottom:1px solid #EFF3F4; font:500 14px/1 var(--pf-sys); color:#536471; flex:none; }
.phone .scr.dark .tabs{ border-color:#2F3336; color:#71767B; }
.phone .tabs span{ display:grid; place-items:center; position:relative; }
.phone .tabs span.on{ font-weight:700; color:#0F1419; }
.phone .scr.dark .tabs span.on{ color:#E7E9EA; }
.phone .tabs span.on::after{ content:""; position:absolute; bottom:0; width:56px; height:4px; border-radius:9999px; background:#1D9BF0; }
.phone .feed{ flex:1; overflow:hidden; position:relative; }
.phone .feed .xp .acts{ max-width:none; }
.phone .feed .lip{ --lh:18px; border-radius:0; box-shadow:none; border-bottom:6px solid var(--l-page); font-size:13px; line-height:18px; }
.phone .scr.dark .feed .lip{ border-bottom-color:#000; }
.phone .tb{ display:flex; justify-content:space-around; align-items:center; height:52px; border-top:1px solid #EFF3F4; color:#0F1419; flex:none; padding-bottom:10px; }
.phone .scr.dark .tb{ border-color:#2F3336; color:#E7E9EA; }
.phone .ic{ fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }

.phone .apph .av{ border-radius:50%; display:grid; place-items:center; color:#fff; font:700 12px/1 -apple-system,BlinkMacSystemFont,sans-serif; background:linear-gradient(135deg,#8B98A5,#536471); }
.phone .fab{ position:absolute; right:14px; bottom:74px; width:52px; height:52px; border-radius:50%; background:#1D9BF0; color:#fff; display:grid; place-items:center; box-shadow:0 6px 16px -4px rgba(0,0,0,.3); }
.phone .fab .ic{ width:22px; height:22px; stroke-width:2.2; }
.phone .home-ind{ position:absolute; bottom:7px; left:50%; width:34%; height:5px; margin-left:-17%; border-radius:5px; background:#000; opacity:.85; }
.phone .scr.dark .home-ind{ background:#fff; }
.phone .me-post{ position:relative; }
.phone .me-post::before{ content:""; position:absolute; inset:0; background:rgba(29,155,240,.07); pointer-events:none; opacity:0; transition:opacity .6s; }
.phone .me-post.hl::before{ opacity:1; }

/* ==========================================================================
   HOMEPAGE: "Keynote for creators"
   Apple's chaptered storytelling, Linear's precision, Arc's warmth.
   Light canvas, one dark keynote chapter, real-looking feeds everywhere.
   The accent (plum) is the only brand color: a soft tint of it marks the hook.
   ========================================================================== */
.hw{ --c-bg:#FEFDF1; --c-bg-2:#F2F0E3; --c-ink:#1A1A1A; --c-2:#4D4C46; --c-3:#65645C; --c-line:rgba(26,26,26,.08); --c-card:#FFFFF8; --c-dark:var(--pb1); --c-dark-2:color-mix(in srgb,var(--pb1),#fff 9%); --c-black:var(--pb2); --c-peri:var(--pa); --c-ember:var(--psp); --c-mark:var(--pa); --c-acc:var(--acc-l); --c-acc-ink:var(--acc-l-ink); --c-lt:#F6F4E6;
  --f-disp:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif; --f-serif:'EB Garamond','Iowan Old Style','Palatino Linotype',Georgia,serif; --f-hand:'Caveat','Bradley Hand',cursive;
  --ease-o:cubic-bezier(.22,1,.36,1); --ease-io:cubic-bezier(.65,0,.35,1);
  background:var(--c-bg); color:var(--c-ink); font:400 16px/1.55 var(--f-disp); overflow-x:clip; -webkit-font-smoothing:antialiased; }
.hw p, .hw h2, .hw h3{ text-wrap:pretty; }
.hw ::selection{ background:var(--c-mark); color:var(--c-ink); }
.hw .wrap{ max-width:1200px; margin:0 auto; padding-inline:clamp(16px,4vw,40px); }
.hw h1, .hw h2, .hw h3{ margin:0; text-wrap:balance; }
.hw h1, .hw h2{ font-family:var(--f-serif); font-weight:400; letter-spacing:-.018em; line-height:1; }
.hw h3{ font-family:var(--f-disp); font-weight:600; letter-spacing:0; }
.hw h1 .mk, .hw h2 .mk, .hw h1 em, .hw h2 em{ font-style:italic; }
:where(.hw) p{ margin:0; }
.hw .mk{ background:var(--psq) no-repeat 0 100% / var(--mkw,100%) .26em; padding:0 .02em .1em; }
.hw .story, .hw .voice2, .hw .on-dark{ --c-mark:color-mix(in srgb,var(--pa) 40%,transparent); }
.hw .mk.draw{ --mkw:0%; animation:mkdraw .9s .75s var(--ease-o) forwards; }
@keyframes mkdraw{ to{ --mkw:100%; } }
@property --mkw{ syntax:'<percentage>'; inherits:false; initial-value:100%; }
.hw .hand{ position:absolute; font:500 23px/1.05 var(--f-hand); color:var(--c-2); pointer-events:none; white-space:nowrap; }
.hw .hand svg{ display:block; overflow:visible; }
.hw .hand path{ fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:var(--len,200); stroke-dashoffset:var(--len,200); animation:draw 1s 1.4s var(--ease-o) forwards; }
@keyframes draw{ to{ stroke-dashoffset:0; } }

/* nav */

/* Wispr grammar, in plum: announcement bar, floating bordered nav, eyebrows, roman + italic headlines, bordered periwinkle buttons, color blocks */
.hw-ann{ display:flex; justify-content:center; align-items:center; gap:14px; flex-wrap:wrap; min-height:44px; padding:10px 16px; background:var(--c-dark); color:#FEFDF1; font:500 14px/1.3 var(--f-disp); text-align:center; }
.hw-ann b{ font-weight:700; } .hw-ann .go{ font-weight:700; white-space:nowrap; } .hw-ann:hover .go{ text-decoration:underline; text-underline-offset:3px; }
.hw .eyebrow{ display:block; margin-bottom:20px; font:500 12.5px/1 var(--f-disp); letter-spacing:.14em; text-transform:uppercase; color:var(--c-2); }
.hw h1 em, .hw h2 em, .hw h3 em{ font-style:italic; }
.hw h1, .hw h2{ font-family:var(--f-serif); font-weight:400; letter-spacing:-.012em; line-height:1.04; }
.hw-hero h1{ font-size:clamp(56px,8.4vw,128px) !important; letter-spacing:-.018em !important; line-height:1.02 !important; }
.story .eyebrow, .voice2 .eyebrow, .fin .eyebrow{ color:rgba(254,253,241,.94); }
.fin{ background:var(--pb3); color:#FEFDF1; border-radius:clamp(28px,4vw,56px); margin:clamp(90px,10vw,140px) clamp(8px,1vw,14px) 14px; }
.fin p{ color:rgba(254,253,241,.9) !important; } .hw .fin .ghost{ color:#FEFDF1; } .hw .fin .ghost .play{ color:#1A1A1A; }
.hw-hero h1{ margin-bottom:22px; }
.story{ border-radius:clamp(28px,4vw,56px) clamp(28px,4vw,56px) 0 0; margin-inline:clamp(8px,1vw,14px); }
.hw-nav{ position:sticky; top:12px; z-index:60; display:flex; align-items:center; gap:22px; height:58px; width:min(920px,calc(100% - 24px)); margin:14px auto 0; padding:0 8px 0 18px; background:#FFFFF8; border:1px solid var(--c-line); border-radius:14px; box-shadow:0 1px 0 rgba(26,26,26,.03); -webkit-backdrop-filter:saturate(1.6) blur(16px); border-bottom:1px solid transparent; transition:background .35s,border-color .35s,color .35s; }
.hw-nav.scrolled{ box-shadow:0 10px 30px -18px rgba(26,26,26,.35); }
.hw-nav.on-dark{ background:#FFFFF8; color:var(--c-ink); }
.hw-nav .logo{ color:inherit; }

.hw-nav .links{ display:flex; gap:4px; }
.hw-nav .links a{ padding:7px 11px; border-radius:99px; font-size:14px; color:inherit; opacity:.66; transition:opacity .2s,background .2s; }
.hw-nav .links a:hover{ opacity:1; background:rgba(127,127,127,.1); }
.hw-nav .grow{ flex:1; }

/* ---------- relatable wall: two rows that drift with your scroll ---------- */

const ic = (id, cls = '') => `<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const pic = (id, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><use href="#p-${id}"/></svg>`;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const lcFirst = s => s && !/^[A-Z]{2}|^I\b/.test(s) ? s[0].toLowerCase() + s.slice(1) : s;
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);

  full: false,

/* ---------- springs: real physics baked into CSS linear() ---------- */
function springEase(stiffness, damping, mass = 1) {
  const w0 = Math.sqrt(stiffness / mass), z = damping / (2 * Math.sqrt(stiffness * mass));
  const wd = w0 * Math.sqrt(Math.max(1e-6, 1 - z * z));
  const x = t => z < 1 ? 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)) : 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  let T = 0.1; for (let t = 0; t < 3; t += 1 / 240) if (Math.abs(1 - x(t)) > 0.006) T = t;
  const n = 36, pts = [];
  for (let i = 0; i <= n; i++) pts.push(+x(T * i / n).toFixed(4));
  pts[n] = 1;
  return { ease: `linear(${pts.join(', ')})`, ms: Math.round(T * 1000) };

})();

function fuzzy(q, s) {
  if (!q) return { score: 1, marks: [] };
  const L = s.toLowerCase(), Q = q.toLowerCase(); const direct = L.indexOf(Q);

  for (let i = 0; i < L.length && j < Q.length; i++) if (L[i] === Q[j]) { marks.push(i); if (last >= 0) gaps += i - last - 1; last = i; j++; }
  return j === Q.length && gaps <= Q.length * 2 ? { score: 50 - gaps, marks } : null;
}

/* a minimal PDF: one JPEG per page, no library (keeps working offline and inside claude.ai) */
function jpegPDF(pages, W, H) {

    obj(pg, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>`);
    obj(im, `<< /Type /XObject /Subtype /Image /Width ${W} /Height ${H} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>`, jpg);
    obj(ct, `<< /Length ${draw.length} >>`, draw); });
  const xref = len, total = 3 + n * 3; push(`xref\n0 ${total}\n0000000000 65535 f \n`); for (let k = 1; k < total; k++) push(`${String(offs[k]).padStart(10, '0')} 00000 n \n`);
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, { type: 'application/pdf' });
}

  if (isEmptyDraft() && Date.now() - (UI.kbNav || 0) > 1500) setTimeout(() => focusTweet(0), 60);
  LLM.ready.then(() => pollReview(true)); onDispose(() => clearTimeout(reviewT));
};

      c.style.opacity = me || F < .01 ? '' : (1 - F * .5).toFixed(3);

  const pickStop = () => {
    let best = -1, bd = 1e9;

  ['Tuesday, 8:41 AM.', 'They stop. They read. They reply.']

}
